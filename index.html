  // Visible error catcher — shows any JS error directly on screen,
  // so a blank page always tells you why, without needing DevTools.
  window.addEventListener('error', function(e){

    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B23A2F;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;word-break:break-word;';
    el.textContent = 'App error: ' + (e.message || (e.error && e.error.message) || 'unknown') + '\n' + (e.filename ? (e.filename + ':' + e.lineno) : '');
    document.body.appendChild(el);
  });
  window.addEventListener('unhandledrejection', function(e){
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B23A2F;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;word-break:break-word;';

  });

<title>Swapneswar Filling Station</title>
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F6;
    --panel: #FFFFFF;
    --panel-2: #F5F7FB;
    --border: #DCE1EA;
    --text: #1C2333;
    --muted: #667085;
    --amber: #C7861F;
    --teal: #2E7688;
    --green: #3E8563;
    --red: #C6483C;
    --lilac: #6E62B8;
    --amber-ink: #8A5A12;
    --teal-ink: #1F5D6B;
    --green-ink: #2F6B4E;
    --red-ink: #A63B30;
    --lilac-ink: #5C4FA6;
    --sidebar-bg: #0E1930;
    --sidebar-bg-2: #16223F;
    --sidebar-border: #232F52;
    --sidebar-text: #AEB9D6;
    --sidebar-text-dim: #6E7BA0;
    --flame-1: #D6483C;
    --flame-2: #E9903C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  a, button{font-family:inherit;}

  /* ---- Shell ---- */
  .shell{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    padding:22px 12px 16px 12px;
    display:flex; flex-direction:column; gap:2px;
    overflow-y:auto;
  }
  .brand{padding:0 10px 18px 10px; border-bottom:1px solid var(--sidebar-border); margin-bottom:10px;}
  .brand .name{font-size:1.42rem; line-height:1.05; color:#fff;}
  .brand .sub{font-size:0.72rem; color:var(--flame-2); margin-top:5px; letter-spacing:0.02em;}
  .nav-group-label{
    font-size:0.68rem; letter-spacing:0.08em; color:var(--sidebar-text-dim);
    padding:14px 12px 6px 12px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:7px;
    background:transparent; border:none; color:var(--sidebar-text);
    font-size:0.9rem; text-align:left; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav-btn:hover{background:var(--sidebar-bg-2); color:#fff;}
  .nav-btn.active{
    background:linear-gradient(90deg, var(--flame-1), var(--flame-2));
    color:#fff; font-weight:600;
  }
  .nav-icon{width:18px; text-align:center; opacity:.9; flex-shrink:0;}

  .topbar{display:none;}

  main{flex:1; padding:28px 32px 60px 32px; max-width:1080px;}
  .page-title{font-size:2rem; color:var(--text); margin-bottom:4px;}
  .page-sub{color:var(--muted); font-size:0.9rem; margin-bottom:24px;}

  /* ---- Cards / panels ---- */
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:820px){
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
  }

  .stat{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:16px 18px; border-left:3px solid var(--amber);
  }
  .stat .label{font-size:0.78rem; color:var(--muted);}
  .stat .value{font-size:1.6rem; margin-top:4px; color:var(--text);}
  .stat.teal{border-left-color:var(--teal);}
  .stat.green{border-left-color:var(--green);}
  .stat.red{border-left-color:var(--red);}
  .stat.lilac{border-left-color:var(--lilac);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:18px; margin-bottom:18px;
    overflow-x:auto;
  }
  .panel h3{font-size:1.2rem; margin-bottom:12px; color:var(--text);}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}

  table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  th{
    text-align:left; color:var(--muted); font-weight:500; font-size:0.76rem;
    padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted); font-size:0.85rem; padding:14px 4px;}

  .tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.75rem; font-weight:500;}
  .tag.hsd{background:rgba(46,118,136,.14); color:var(--teal-ink);}
  .tag.ms{background:rgba(199,134,31,.14); color:var(--amber-ink);}
  .tag.xtra{background:rgba(110,98,184,.14); color:var(--lilac-ink);}
  .tag.paid{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.due{background:rgba(198,72,60,.14); color:var(--red-ink);}
  .tag.pending{background:rgba(199,134,31,.14); color:var(--amber-ink);}
  .tag.verified{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.auto{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.manual{background:rgba(102,112,133,.14); color:var(--muted);}
  .shift-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .shift-tabs .btn.chip{padding:7px 14px; border-radius:20px; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); font-size:0.82rem;}
  .shift-tabs .btn.chip.active{background:var(--amber); color:#1A1206; border-color:var(--amber);}
  .field-inline{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .subtle{font-size:0.78rem; color:var(--muted);}
  .divider{height:1px; background:var(--border); margin:16px 0;}

  /* ---- Forms ---- */
  .btn{
    background:var(--amber); color:#1A1206; border:none; border-radius:6px;
    padding:9px 16px; font-size:0.88rem; font-weight:600; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.small{padding:5px 11px; font-size:0.8rem;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.danger{background:var(--red); color:#fff;}

  form.inline-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; align-items:end; margin-bottom:6px;}
  label{display:block; font-size:0.75rem; color:var(--muted); margin-bottom:5px;}
  input, select{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:8px 10px; font-size:0.87rem; font-family:inherit;
  }
  input:focus, select:focus{outline:1px solid var(--amber);}

  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    align-items:flex-start; justify-content:center; z-index:50; padding:16px;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px; width:100%; max-width:440px; margin:16px auto;}
  .modal h3{margin-bottom:14px;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px;}

  .section{display:none;}
  .section.active{display:block;}

  .bottom-nav{display:none;}
  @media (max-width:760px){
    .rail{
      position:fixed; top:0; left:0; bottom:0; z-index:60;
      transform:translateX(-100%); transition:transform .2s ease;
      width:250px;
    }
    .rail.open{transform:translateX(0);}
    .rail-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55;}
    .rail-scrim.open{display:block;}
    .topbar{
      display:flex; align-items:center; gap:12px;
      background:var(--sidebar-bg); border-bottom:1px solid var(--sidebar-border);
      padding:14px 16px; position:sticky; top:0; z-index:40;
    }
    .topbar .name{font-size:1.15rem; color:#fff;}
    .hamburger{
      width:34px; height:34px; border-radius:7px; border:1px solid var(--sidebar-border);
      background:var(--sidebar-bg-2); color:#fff; font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    main{padding:18px 14px 40px 14px;}
    .grid-4{grid-template-columns:1fr 1fr;}
  }

  .loading{color:var(--muted); font-size:0.85rem; padding:20px 0;}
  .printable-report{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px;}
  .report-header{border-bottom:2px solid var(--border); padding-bottom:12px;}
  .report-station{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:1.4rem;}
  .report-total{font-size:1.3rem; font-weight:700; margin:14px 0 6px 0; color:var(--red-ink);}

  .bill-header{text-align:center; border-bottom:2px solid #c0392b; padding-bottom:10px; margin-bottom:10px;}
  .bill-station-name{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:1.7rem; color:#1a3a6b;}
  .bill-contact{font-size:0.82rem; color:#c0392b;}
  .bill-address{font-size:0.82rem; color:#c0392b;}
  .bill-gstin{font-size:0.85rem; color:#1a3a6b; font-weight:600;}
  .bill-refdate{display:flex; justify-content:space-between; font-size:0.85rem; margin:10px 0; flex-wrap:wrap; gap:8px;}
  .bill-title{text-align:center; text-decoration:underline; font-weight:700; margin-bottom:10px;}
  .bill-info-table, .bill-items, .bill-total-table{width:100%; border-collapse:collapse; font-size:0.85rem; margin-bottom:2px;}
  .bill-info-table td{border:1px solid var(--border); padding:8px; vertical-align:top;}
  .bill-meta div{margin-bottom:3px;}
  .bill-desc{text-decoration:underline; font-size:0.85rem; text-align:center; border:1px solid var(--border); border-bottom:none; padding:6px;}
  .bill-items th, .bill-items td{border:1px solid var(--border); padding:6px 8px; text-align:left;}
  .bill-items th{background:var(--panel-2);}
  .bill-items td:first-child, .bill-items th:first-child{text-align:center;}
  .bill-total-table td{border:1px solid var(--border); border-top:none; padding:8px;}
  .bill-total{text-align:right; font-weight:700; white-space:nowrap;}
  .bill-footer{display:flex; justify-content:space-between; gap:16px; border:1px solid var(--border); border-top:none; padding:12px; font-size:0.85rem; flex-wrap:wrap;}
  .bill-sign{text-align:right;}
  .print-page-break{height:1px;}

  @media print{
    .rail, .topbar, .no-print, .modal-bg{display:none !important;}
    main{padding:0 !important;}
    body{background:#fff !important;}
    .printable-report{border:none; padding:0; background:#fff;}
    .panel{border:1px solid #ccc; break-inside:avoid;}
    .print-page-break{break-after:page;}
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--sidebar-bg); padding:20px;}
  .login-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px 28px; width:100%; max-width:380px;}
  .login-card h1{font-size:1.6rem; color:var(--text); margin-bottom:4px;}
  .login-card .sub{color:var(--muted); font-size:0.85rem; margin-bottom:20px;}
  .login-error{color:var(--red-ink); font-size:0.82rem; margin-top:8px; min-height:1em;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:52px;}
  .pw-toggle{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); font-size:0.76rem; padding:6px 8px; text-decoration:underline;}
  .role-badge{font-size:0.72rem; padding:3px 9px; border-radius:20px; background:var(--panel-2); color:var(--muted); text-transform:capitalize;}
  .topbar-user{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .topbar-user .role-badge{color:#fff; background:rgba(255,255,255,.12);}
  .signout-link{color:var(--sidebar-text); font-size:0.78rem; background:none; border:none; cursor:pointer; text-decoration:underline;}
  .sidebar-user{padding:10px 12px; margin-top:auto; border-top:1px solid var(--sidebar-border); font-size:0.8rem; color:var(--sidebar-text);}
</style>

<script>
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtMoney(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits: 2}); }

function numberToWordsIndian(num){
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'Zero Rupees Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){
    if (n < 20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  }
  function threeDigits(n){
    if (n < 100) return twoDigits(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + twoDigits(n%100) : '');
  }
  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh = Math.floor(num / 100000); num %= 100000;
  const thousand = Math.floor(num / 1000); num %= 1000;
  const rest = num;
  const parts = [];
  if (crore) parts.push(threeDigits(crore) + ' Crore');
  if (lakh) parts.push(threeDigits(lakh) + ' Lakh');
  if (thousand) parts.push(threeDigits(thousand) + ' Thousand');
  if (rest) parts.push(threeDigits(rest));
  return parts.join(' ') + ' Rupees Only';
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function todayISO() { return new Date().toISOString().slice(0,10); }

// ---------------- App state ----------------
let DATA = {};
let CURRENT = 'dashboard';

let MOBILE_NAV_OPEN = false;

const FUEL_TYPES = [
  {id:'MS', name:'MS (Petrol)', tag:'ms'},
  {id:'HSD', name:'HSD (Diesel)', tag:'hsd'},
  {id:'XTRA', name:'Xtra Green', tag:'xtra'},
];

function fuelTag(f){
  const found = FUEL_TYPES.find(x=>x.id===f);
  return found ? found.tag : 'ms';
}

// Operations page state
let OPS_DATE = todayISO();
let OPS_SHIFT = 'day';
let MANAGER_HUB_TAB = 'nozzles';
let EXPENSE_FILTER = '';
let CASH_HANDOVER_TAB = 'fund';
let COLLAPSED_PANELS = new Set(['salesThisShift']);
let EXPENSE_SORT_FIELD = 'date';
let EXPENSE_SORT_DIR = 'desc';
let DEV_MODE_UNLOCKED = false;
let brandTapCount = 0;
let brandTapTimer = null;
function handleBrandTap(){
  brandTapCount++;
  clearTimeout(brandTapTimer);
  brandTapTimer = setTimeout(()=>{ brandTapCount = 0; }, 2500);
  if (brandTapCount >= 7){
    brandTapCount = 0;
    if (CURRENT_USER && CURRENT_USER.role === 'admin'){
      DEV_MODE_UNLOCKED = true;
      render();
    }
  }
}

function getTank(fuelType){ return DATA[SKEYS.stock].find(s=>s.fuelType===fuelType); }
function getReading(nozzleId, date, shift){
  return DATA[SKEYS.shiftReadings].find(r=>r.nozzleId===nozzleId && r.date===date && r.shift===shift);
}
function getIoclReading(nozzleId, date, shift){
  return DATA[SKEYS.ioclReadings].find(r=>r.nozzleId===nozzleId && r.date===date && r.shift===shift);
}
function shiftCreditEntries(date, shift){
  return DATA[SKEYS.custTx].filter(t=>t.type==='fuel' && t.date===date && t.shift===shift);
}
function customerBalance(customerId){
  return DATA[SKEYS.custTx].filter(t=>t.customerId===customerId).reduce((s,t)=> s + (t.type==='fuel'? Number(t.amount) : -Number(t.amount)), 0);
}

function nozzleTestLitresInRange(nozzleId, readingId, openingBound, closingBound){
  // Prefer an explicit link (set when the test was recorded during this
  // exact shift). Also catch older/unlinked tests whose recorded meter
  // range falls entirely within this shift's opening-to-closing range —
  // this makes it self-healing for tests logged before linking existed,
  // or where the shift context wasn't what it should've been at the time.
  return DATA[SKEYS.nozzleTests]
    .filter(t => t.nozzleId === nozzleId && (
      (readingId && t.readingId === readingId) ||
      (!t.readingId &&
        Number(t.openingReading) >= Number(openingBound) &&
        Number(t.closingReading) <= Number(closingBound))
    ))
    .reduce((s,t)=> s + (Number(t.closingReading) - Number(t.openingReading)), 0);
}
function soldLitresForReading(r){
  const raw = Number(r.closingVerified) - Number(r.openingVerified);
  return raw - nozzleTestLitresInRange(r.nozzleId, r.id, r.openingVerified, r.closingVerified);
}

function shiftTotals(date, shift){
  const nozzles = DATA[SKEYS.nozzles];
  const perFuel = {};
  FUEL_TYPES.forEach(f=> perFuel[f.id] = {litres:0, value:0});
  let cashTotal = 0, upiTotal = 0, cardTotal = 0;
  nozzles.forEach(n=>{
    const r = getReading(n.id, date, shift);
    if (r && r.status === 'verified'){
      const litres = soldLitresForReading(r);
      const tank = getTank(n.fuelType);
      const value = litres * (tank ? Number(tank.rate) : 0);
      if (!perFuel[n.fuelType]) perFuel[n.fuelType] = {litres:0, value:0};
      perFuel[n.fuelType].litres += litres;
      perFuel[n.fuelType].value += value;
    }
    if (r && (r.status === 'pending' || r.status === 'verified')){
      cashTotal += Number(r.cashCollected || 0);
      upiTotal += Number(r.upiCollected || 0);
      cardTotal += Number(r.cardCollected || 0);
    }
  });
  const totalSaleValue = Object.values(perFuel).reduce((s,v)=>s+v.value,0);
  const credits = shiftCreditEntries(date, shift);
  const totalCredit = credits.reduce((s,c)=>s+Number(c.amount),0);
  const expectedCash = totalSaleValue - totalCredit;
  const paymentBreakdown = {cash: cashTotal, upi: upiTotal, card: cardTotal, credit: totalCredit};
  const paymentBreakdownTotal = cashTotal + upiTotal + cardTotal + totalCredit;
  return {perFuel, totalSaleValue, totalCredit, expectedCash, credits, paymentBreakdown, paymentBreakdownTotal};
}

function nozzleCreditTotal(nozzleId, date, shift){
  return DATA[SKEYS.custTx]
    .filter(t=>t.type==='fuel' && t.date===date && t.shift===shift && t.nozzleId===nozzleId)
    .reduce((s,t)=>s+Number(t.amount),0);
}

function nozzleSaleEntryTotals(nozzleId, date, shift){
  const entries = DATA[SKEYS.saleEntries].filter(s=>s.nozzleId===nozzleId && s.date===date && s.shift===shift);
  return {
    cash: entries.filter(e=>e.type==='cash').reduce((s,e)=>s+Number(e.amount),0),
    upi: entries.filter(e=>e.type==='upi').reduce((s,e)=>s+Number(e.amount),0),
    card: entries.filter(e=>e.type==='card').reduce((s,e)=>s+Number(e.amount),0),
    entries,
  };
}

function formChangePassword(){
  openModal(`
    <h3>Change password</h3>
    <form id="f">
      <label>Current password</label>
      <div class="pw-wrap">
        <input name="currentPassword" type="password" required autocomplete="current-password" id="changePwCurrentInput">
        <button type="button" class="pw-toggle" onclick="togglePwVisibility('changePwCurrentInput', this)">Show</button>
      </div>
      <div style="height:10px;"></div>
      <label>New password</label>
      <input name="newPassword" type="text" required minlength="6" placeholder="At least 6 characters">
      <div class="login-error" id="pwFormError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn">Update password</button>
      </div>
    </form>
  `);
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, fd.get('currentPassword'));
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(fd.get('newPassword'));
      closeModal();
    } catch(err){
      document.getElementById('pwFormError').textContent = err.message;
      btn.disabled = false; btn.textContent = 'Update password';
    }
  });
}

function pageDashboard(){
  const stock = DATA[SKEYS.stock];
  const totalStockValue = stock.reduce((s,r)=> s + r.currentStock * r.rate, 0);
  const ledger = DATA[SKEYS.ledger];
  const income = ledger.filter(l=>l.type==='income').reduce((s,l)=>s+Number(l.amount),0);
  const expense = ledger.filter(l=>l.type==='expense').reduce((s,l)=>s+Number(l.amount),0);
  const custTx = DATA[SKEYS.custTx];
  const customers = DATA[SKEYS.customers];
  const outstandingByCust = {};
  custTx.forEach(t=>{
    outstandingByCust[t.customerId] = (outstandingByCust[t.customerId]||0) + (t.type==='fuel' ? Number(t.amount) : -Number(t.amount));
  });
  const totalOutstanding = Object.values(outstandingByCust).reduce((s,v)=>s+v,0);
  const employees = DATA[SKEYS.employees];

  const checkouts = DATA[SKEYS.shiftReadings].filter(r => r.status === 'pending' || r.status === 'verified');
  const cashRevenue = checkouts.reduce((s,r)=> s + Number(r.cashCollected||0), 0);
  const upiRevenue = checkouts.reduce((s,r)=> s + Number(r.upiCollected||0), 0);
  const cardRevenue = checkouts.reduce((s,r)=> s + Number(r.cardCollected||0), 0);
  const creditRevenue = checkouts.reduce((s,r)=> s + Number(r.creditAtCheckout||0), 0);
  const trackedRevenue = cashRevenue + upiRevenue + cardRevenue + creditRevenue;
  const otherIncome = income - trackedRevenue; // manual ledger income entries not tied to a checkout
  const cashExpenses = ledger.filter(l=>l.type==='expense' && l.paymentMethod==='Cash').reduce((s,l)=>s+Number(l.amount),0);

  const team = DATA[SKEYS.users] || [];
  const managerRoleIds = new Set(team.filter(t=>['manager','admin'].includes(t.role)).map(t=>t.id));
  const ownerRoleIds = new Set(team.filter(t=>t.role==='owner').map(t=>t.id));
  function resolveVerifierUid(r){ return r.verifiedByUid || (team.find(t=>t.name===r.verifiedBy) || {}).id; }
  const verifiedCash = checkouts.filter(r=>r.status==='verified' && (r.verifiedByUid || r.verifiedBy));
  const managersCashIn = verifiedCash.filter(r=>managerRoleIds.has(resolveVerifierUid(r))).reduce((s,r)=>s+Number(r.cashCollected||0),0);
  const ownersCashIn = verifiedCash.filter(r=>ownerRoleIds.has(resolveVerifierUid(r))).reduce((s,r)=>s+Number(r.cashCollected||0),0);
  const cashExpenseRows = ledger.filter(l=>l.type==='expense' && l.paymentMethod==='Cash');
  const managersCashExpense = cashExpenseRows.filter(l=>managerRoleIds.has(l.spentByUid)).reduce((s,l)=>s+Number(l.amount),0);
  const ownersCashExpense = cashExpenseRows.filter(l=>ownerRoleIds.has(l.spentByUid)).reduce((s,l)=>s+Number(l.amount),0);
  const ownerHandovers = DATA[SKEYS.cashHandovers].filter(h=>h.toRole==='owner');
  const confirmedHandoverTotal = ownerHandovers.filter(h=>h.status==='confirmed').reduce((s,h)=>s+Number(h.amount),0);
  const pendingHandoverTotal = ownerHandovers.filter(h=>h.status==='pending').reduce((s,h)=>s+Number(h.amount),0);
  const managersFund = managersCashIn - managersCashExpense - confirmedHandoverTotal - pendingHandoverTotal;
  const ownersFund = ownersCashIn + confirmedHandoverTotal - ownersCashExpense;
  const actualCashWithManagers = managersFund + ownersFund;
  const awaitingCheckout = checkouts.filter(r=>r.status==='pending').reduce((s,r)=>s+Number(r.cashCollected||0),0);
  const computedAmountLeft = cashRevenue - cashExpenses - awaitingCheckout;

  return `
    <h1 class="page-title">Dashboard</h1>
    <div class="page-sub">Snapshot for ${fmtDate(todayISO())}</div>

    <div class="grid grid-4" style="margin-bottom:22px;">
      <button type="button" class="stat green" id="revenueBreakdownBtn" style="text-align:left; cursor:pointer; border:none; border-left:3px solid var(--green); width:100%; display:block; font-family:inherit;">
        <div class="label">All revenue (tap for breakdown)</div><div class="value">${fmtMoney(income)}</div>
      </button>
      <div class="stat"><div class="label">Total cash revenue</div><div class="value">${fmtMoney(cashRevenue)}</div></div>
      <div class="stat red"><div class="label">Total expenses</div><div class="value">${fmtMoney(expense)}</div></div>
      <div class="stat lilac"><div class="label">Fuel stock value</div><div class="value">${fmtMoney(totalStockValue)}</div></div>
    </div>

    <div class="panel">
      <h3>Cash position check</h3>
      <table>
        <tr><td>Total cash revenue</td><td style="text-align:right;">${fmtMoney(cashRevenue)}</td></tr>
        <tr><td>− Cash expenses</td><td style="text-align:right;">${fmtMoney(cashExpenses)}</td></tr>
        ${awaitingCheckout > 0 ? `<tr><td>− Closed by nozzle boy, awaiting manager checkout</td><td style="text-align:right;">${fmtMoney(awaitingCheckout)}</td></tr>` : ''}
        <tr><td><strong>= Amount that should be left across both funds</strong></td><td style="text-align:right;"><strong>${fmtMoney(computedAmountLeft)}</strong></td></tr>
        <tr><td>Managers Fund + Owner's Fund (Cash Book page, right now)</td><td style="text-align:right;">${fmtMoney(actualCashWithManagers)}</td></tr>
      </table>
      <p class="subtle" style="margin-top:10px;">${Math.abs(computedAmountLeft-actualCashWithManagers)<1
        ? 'These two match — every rupee is accounted for.'
        : `These differ by ${fmtMoney(computedAmountLeft-actualCashWithManagers)} — usually cash sitting in an unconfirmed handover, or worth checking the Cash Book page's reconciliation for details.`}</p>
    </div>

    <div class="grid grid-2">
      <div class="panel">
        <h3>Tank levels</h3>
        ${stock.length ? `<table>
          <tr><th>Fuel</th><th>Stock</th><th>Capacity</th><th>Rate/L</th></tr>
          ${stock.map(s=>`<tr>
            <td><span class="tag ${fuelTag(s.fuelType)}">${s.fuelType}</span></td>
            <td>${Number(s.currentStock).toLocaleString('en-IN')} L</td>
            <td>${Number(s.tankCapacity).toLocaleString('en-IN')} L</td>
            <td>${fmtMoney(s.rate)}</td>
          </tr>`).join('')}
        </table>` : `<div class="empty">No stock records yet.</div>`}
      </div>
      <div class="panel">
        <h3>Team &amp; accounts at a glance</h3>
        <table>
          <tr><td>Active employees</td><td style="text-align:right;">${employees.length}</td></tr>
          <tr><td>Registered customers</td><td style="text-align:right;">${customers.length}</td></tr>
          <tr><td>Customer credit outstanding</td><td style="text-align:right;">${fmtMoney(totalOutstanding)}</td></tr>
          <tr><td>Net cash position</td><td style="text-align:right;">${fmtMoney(income-expense)}</td></tr>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>Nozzle-wise sales — today</h3>
      <table>
        <tr><th>Nozzle</th><th>Fuel</th><th>Shift</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Sale value</th><th>Status</th></tr>
        ${[...DATA[SKEYS.nozzles]].sort((a,b)=>a.number-b.number).flatMap(n=>['day','night'].map(sh=>{
          const r = getReading(n.id, todayISO(), sh);
          if (!r) return null;
          const opening = r.status==='verified' ? r.openingVerified : r.openingSubmitted;
          const closing = r.status==='verified' ? r.closingVerified : r.closingSubmitted;
          const litres = r.status==='verified' ? soldLitresForReading(r) : null;
          const tank = getTank(n.fuelType);
          const value = litres!=null && tank ? litres * Number(tank.rate) : null;
          const st = readingStatusTag(r.status);
          return `<tr>
            <td>#${n.number}</td>
            <td><span class="tag ${fuelTag(n.fuelType)}">${n.fuelType}</span></td>
            <td>${shiftLabel(sh)}</td>
            <td>${opening}</td>
            <td>${closing ?? '—'}</td>
            <td>${litres!=null ? Number(litres).toLocaleString('en-IN') : '—'}</td>
            <td>${value!=null ? fmtMoney(value) : '—'}</td>
            <td><span class="tag ${st.cls}">${st.label}</span></td>
          </tr>`;
        })).filter(Boolean).join('') || `<tr><td colspan="8" class="empty">No nozzle activity yet today.</td></tr>`}
      </table>
    </div>
  `;
}

function shiftLabel(s){
  if (s === 'day') return 'Day shift';
  if (s === 'night') return 'Night shift';
  if (s === 'emergency') return 'Emergency shift';
  return s;
}

function getCurrentShift(){
  const s = DATA[SKEYS.opsSettings];
  const toMins = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };
  const nowMins = new Date().getHours()*60 + new Date().getMinutes();
  const dayStart = toMins(s.dayStart), dayEnd = toMins(s.dayEnd);
  if (dayStart < dayEnd) return (nowMins >= dayStart && nowMins < dayEnd) ? 'day' : 'night';
  // handles a day window that itself wraps past midnight
  return (nowMins >= dayStart || nowMins < dayEnd) ? 'day' : 'night';
}

function readingStatusTag(status){
  if (status === 'verified') return {label:'Checked out (final)', cls:'verified'};
  if (status === 'pending') return {label:'Awaiting manager checkout', cls:'pending'};
  if (status === 'checked-in') return {label:'Checked in', cls:'pending'};
  return {label:'Not checked in', cls:'manual'};
}

function buildFundLedger(pool, team){
  // pool is 'managers' or 'owner'. Builds a single shared chronological
  // ledger for that pool — checkouts performed by anyone in it, cash
  // expenses paid out of it, and its handover(s) to/from the other pool.
  const inRoles = pool === 'managers' ? ['manager','admin'] : ['owner'];
  const roleIds = new Set(team.filter(t=>inRoles.includes(t.role)).map(t=>t.id));
  const nozzles = DATA[SKEYS.nozzles];
  const events = [];
  DATA[SKEYS.shiftReadings]
    .filter(r => r.status === 'verified' && Number(r.cashCollected||0) > 0)
    .forEach(r => {
      const uid = r.verifiedByUid || (team.find(t=>t.name===r.verifiedBy) || {}).id;
      if (!uid || !roleIds.has(uid)) return;
      const person = team.find(t=>t.id===uid);
      const n = nozzles.find(x=>x.id===r.nozzleId);
      events.push({
        date: r.date, sortAt: r.verifiedAt || r.date, dir: 'in',
        desc: `Checkout by ${person?person.name:r.verifiedBy} — ${n ? '#'+n.number : 'nozzle'}, ${shiftLabel(r.shift)}`,
        amount: Number(r.cashCollected||0),
      });
    });
  DATA[SKEYS.ledger].filter(l => l.type==='expense' && l.paymentMethod==='Cash' && roleIds.has(l.spentByUid)).forEach(l => {
    events.push({date: l.date, sortAt: l.date, dir:'out', desc: `Expense — ${l.category}${l.paidTo?' ('+l.paidTo+')':''}`, amount: Number(l.amount)});
  });
  DATA[SKEYS.cashHandovers].filter(h => h.toRole === 'owner').forEach(h => {
    if (pool === 'managers'){
      events.push({date: h.createdAt.slice(0,10), sortAt: h.createdAt, dir:'out',
        desc: `Handed to Owner (by ${h.fromName})${h.status==='pending'?' — awaiting confirmation':''}`, amount: Number(h.amount)});
    } else if (h.status === 'confirmed'){
      events.push({date: (h.confirmedAt||h.createdAt).slice(0,10), sortAt: h.confirmedAt||h.createdAt, dir:'in',
        desc: `Received from Managers Fund (${h.fromName})`, amount: Number(h.amount)});
    }
  });
  events.sort((a,b)=> new Date(a.sortAt) - new Date(b.sortAt));
  let running = 0;
  return events.map(e => {
    running += e.dir==='in' ? e.amount : -e.amount;
    return {...e, balance: running};
  });
}

function pageCashHandover(){
  const team = DATA[SKEYS.users] || [];
  const handovers = DATA[SKEYS.cashHandovers].filter(h => h.toRole === 'owner');
  const canEditHandovers = ['admin','owner'].includes(CURRENT_USER.role);
  const canHandover = ['manager','admin'].includes(CURRENT_USER.role);
  const canConfirm = ['owner','admin'].includes(CURRENT_USER.role);
  const pendingToOwner = handovers.filter(h => h.status === 'pending');
  const allHistory = [...handovers].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const filterText = EXPENSE_FILTER.trim().toLowerCase();
  let expenseRows = DATA[SKEYS.ledger].filter(l => l.type === 'expense');
  if (filterText){
    expenseRows = expenseRows.filter(l =>
      (l.category||'').toLowerCase().includes(filterText) ||
      (l.paidTo||'').toLowerCase().includes(filterText) ||
      (l.note||'').toLowerCase().includes(filterText) ||
      (l.billNo||'').toLowerCase().includes(filterText)
    );
  }
  expenseRows = [...expenseRows].sort((a,b)=>{
    let av = a[EXPENSE_SORT_FIELD], bv = b[EXPENSE_SORT_FIELD];
    if (EXPENSE_SORT_FIELD === 'amount'){ av = Number(av)||0; bv = Number(bv)||0; }
    else { av = String(av||''); bv = String(bv||''); }
    const cmp = av < bv ? -1 : av > bv ? 1 : 0;
    return EXPENSE_SORT_DIR === 'asc' ? cmp : -cmp;
  });

  // Two pooled funds, not per-person balances. Managers Fund = every manager/
  // admin's checkout cash, combined, minus cash expenses any of them paid,
  // minus whatever's been handed to the Owner (confirmed or still pending —
  // it leaves the pool the moment it's sent). Owner's Fund = confirmed
  // receipts from that pool, plus any checkout cash the owner personally
  // collected, minus the owner's own cash expenses.
  const managerRoleIds = new Set(team.filter(t=>['manager','admin'].includes(t.role)).map(t=>t.id));
  const ownerRoleIds = new Set(team.filter(t=>t.role==='owner').map(t=>t.id));
  const verifiedCash = DATA[SKEYS.shiftReadings].filter(r => r.status === 'verified' && (r.verifiedByUid || r.verifiedBy));
  function resolveVerifierUid(r){ return r.verifiedByUid || (team.find(t=>t.name===r.verifiedBy) || {}).id; }
  const managersCashIn = verifiedCash.filter(r=>managerRoleIds.has(resolveVerifierUid(r))).reduce((s,r)=>s+Number(r.cashCollected||0),0);
  const ownersCashIn = verifiedCash.filter(r=>ownerRoleIds.has(resolveVerifierUid(r))).reduce((s,r)=>s+Number(r.cashCollected||0),0);
  const cashExpenses = DATA[SKEYS.ledger].filter(l => l.type === 'expense' && l.paymentMethod === 'Cash');
  const managersCashExpense = cashExpenses.filter(l=>managerRoleIds.has(l.spentByUid)).reduce((s,l)=>s+Number(l.amount),0);
  const ownersCashExpense = cashExpenses.filter(l=>ownerRoleIds.has(l.spentByUid)).reduce((s,l)=>s+Number(l.amount),0);
  const confirmedHandoverTotal = handovers.filter(h=>h.status==='confirmed').reduce((s,h)=>s+Number(h.amount),0);
  const pendingHandoverTotal = handovers.filter(h=>h.status==='pending').reduce((s,h)=>s+Number(h.amount),0);
  const managersFund = managersCashIn - managersCashExpense - confirmedHandoverTotal - pendingHandoverTotal;
  const ownersFund = ownersCashIn + confirmedHandoverTotal - ownersCashExpense;

  // Reconciliation: every rupee ever collected in cash should still be
  // traceable across the two funds, cash expenses, cash in transit to the
  // Owner, and cash a nozzle boy has closed but a manager hasn't yet
  // given the final checkout to.
  const totalCashCollected = DATA[SKEYS.shiftReadings]
    .filter(r => r.status === 'pending' || r.status === 'verified')
    .reduce((s,r)=> s + Number(r.cashCollected || 0), 0);
  const totalCashExpenses = managersCashExpense + ownersCashExpense;
  const totalAwaitingCheckout = DATA[SKEYS.shiftReadings].filter(r=>r.status==='pending').reduce((s,r)=> s + Number(r.cashCollected||0), 0);
  const reconDiff = totalCashCollected - (managersFund + ownersFund + totalCashExpenses + pendingHandoverTotal + totalAwaitingCheckout);

  // Day-by-day log of every checkout that put cash into either fund.
  const nozzlesForLog = DATA[SKEYS.nozzles];
  const cashInflowLog = verifiedCash.filter(r=>Number(r.cashCollected||0)>0).map(r => {
    const uid = resolveVerifierUid(r);
    const person = uid ? team.find(t=>t.id===uid) : null;
    const n = nozzlesForLog.find(x=>x.id===r.nozzleId);
    return {
      date: r.date, personName: person ? person.name : (r.verifiedBy || '—'),
      pool: person && ownerRoleIds.has(person.id) ? "Owner's Fund" : 'Managers Fund',
      detail: n ? `Nozzle #${n.number}, ${shiftLabel(r.shift)}` : shiftLabel(r.shift),
      amount: Number(r.cashCollected||0), sortAt: r.verifiedAt || r.date,
    };
  }).sort((a,b)=> new Date(b.sortAt) - new Date(a.sortAt));
  const inflowLogCollapsed = COLLAPSED_PANELS.has('cashInflowLog');

  const allHandoversCollapsed = COLLAPSED_PANELS.has('allHandovers');
  const expensesCollapsed = COLLAPSED_PANELS.has('expensesTable');

  return `
    <h1 class="page-title">Cash Book</h1>
    <div class="page-sub">One combined Managers Fund, and the Owner's Fund — what came in, what went out, what's left</div>

    <div class="shift-tabs">
      <button type="button" class="btn chip ${CASH_HANDOVER_TAB==='fund'?'active':''}" data-cashtab="fund">Fund</button>
      <button type="button" class="btn chip ${CASH_HANDOVER_TAB==='expenses'?'active':''}" data-cashtab="expenses">Expenses</button>
    </div>

    ${CASH_HANDOVER_TAB==='fund' ? `
    <div class="panel">
      <h3>Funds</h3>
      <div class="grid grid-2">
        <div class="stat ${managersFund<0?'red':'green'}">
          <div class="label">Managers Fund (combined)</div>
          <div class="value">${fmtMoney(managersFund)}</div>
        </div>
        <div class="stat ${ownersFund<0?'red':'teal'}">
          <div class="label">Owner's Fund</div>
          <div class="value">${fmtMoney(ownersFund)}</div>
        </div>
      </div>
      <p class="subtle" style="margin-top:10px;">Managers Fund = every manager's checkout cash, combined, minus cash expenses, minus whatever's been handed to the Owner. Owner's Fund = what's been received from that pool, minus the Owner's own cash expenses. There's no per-person split anymore — it's all one shared pool per side.</p>
    </div>

    <div class="panel">
      <h3>Cash reconciliation</h3>
      <table>
        <tr><td>Total cash collected (all checkouts, all-time)</td><td style="text-align:right;">${fmtMoney(totalCashCollected)}</td></tr>
        <tr><td>Managers Fund right now</td><td style="text-align:right;">${fmtMoney(managersFund)}</td></tr>
        <tr><td>Owner's Fund right now</td><td style="text-align:right;">${fmtMoney(ownersFund)}</td></tr>
        <tr><td>Cash expenses paid out (both funds)</td><td style="text-align:right;">${fmtMoney(totalCashExpenses)}</td></tr>
        ${pendingHandoverTotal > 0 ? `<tr><td>Sent to Owner, awaiting confirmation</td><td style="text-align:right;">${fmtMoney(pendingHandoverTotal)}</td></tr>` : ''}
        ${totalAwaitingCheckout > 0 ? `<tr><td>Closed by nozzle boy, awaiting manager checkout</td><td style="text-align:right;">${fmtMoney(totalAwaitingCheckout)}</td></tr>` : ''}
        <tr><td><strong>Difference</strong></td><td style="text-align:right;"><strong style="color:${Math.abs(reconDiff)<1?'var(--green-ink)':'var(--red-ink)'};">${fmtMoney(reconDiff)}</strong></td></tr>
      </table>
      <p class="subtle" style="margin-top:10px;">This should read ₹0. A nonzero figure usually means an edited or deleted handover/expense somewhere, or cash that went unaccounted.</p>
    </div>

    <div class="panel">
      <div class="row-between">
        <h3 style="margin:0; cursor:pointer;" data-togglepanel="cashInflowLog">${inflowLogCollapsed?'▶':'▼'} How the funds got their cash — day by day</h3>
        <button class="btn ghost small" id="exportCashInflowBtn" ${cashInflowLog.length?'':'disabled'}>Export to Excel</button>
      </div>
      ${inflowLogCollapsed ? '' : `
      <p class="subtle" style="margin-bottom:10px;">Every checkout that put cash into one of the two funds.</p>
      ${cashInflowLog.length ? `<table>
        <tr><th>Date</th><th>Person</th><th>Fund</th><th>Detail</th><th>Amount</th></tr>
        ${cashInflowLog.map(e=>`<tr>
          <td>${fmtDate(e.date)}</td>
          <td>${e.personName}</td>
          <td>${e.pool}</td>
          <td>${e.detail}</td>
          <td>${fmtMoney(e.amount)}</td>
        </tr>`).join('')}
      </table>` : `<div class="empty">No cash inflow recorded yet.</div>`}
      `}
    </div>

    ${canHandover ? `
    <div class="panel">
      <div class="row-between">
        <h3 style="margin:0;">Hand over to Owner</h3>
        <button class="btn small" id="handoverToOwnerBtn">+ Hand over to Owner</button>
      </div>
      <p class="subtle" style="margin-top:10px;">Moves cash out of the combined Managers Fund and into the Owner's Fund once confirmed. There's no other handover direction anymore — cash from a nozzle boy's shift already lands in the Managers Fund the moment a manager gives it the final checkout.</p>
    </div>
    ` : ''}

    ${pendingToOwner.length && canConfirm ? `
    <div class="panel">
      <h3>Awaiting confirmation</h3>
      <table>
        <tr><th>From</th><th>Amount</th><th>Note</th><th>Date</th><th></th></tr>
        ${pendingToOwner.map(h=>`<tr>
          <td>${h.fromName} <span class="role-badge">${ROLE_LABELS[h.fromRole]||h.fromRole}</span></td>
          <td>${fmtMoney(h.amount)}</td>
          <td>${h.note||'—'}</td>
          <td>${fmtDate(h.createdAt.slice(0,10))}</td>
          <td><button class="btn small" data-confirmhandover="${h.id}">Confirm receipt</button></td>
        </tr>`).join('')}
      </table>
    </div>` : ''}

    <div class="panel">
      <div class="row-between">
        <h3 style="margin:0; cursor:pointer;" data-togglepanel="allHandovers">${allHandoversCollapsed?'▶':'▼'} All handovers to Owner</h3>
        <button class="btn ghost small" id="exportHandoversBtn" ${allHistory.length?'':'disabled'}>Export to Excel</button>
      </div>
      ${allHandoversCollapsed ? '' : `
      <p class="subtle" style="margin-bottom:10px;">Every transfer from the Managers Fund to the Owner, visible to everyone with access to this page.</p>
      ${allHistory.length ? `<table>
        <tr><th>Date</th><th>From</th><th>Amount</th><th>Status</th><th>Confirmed by</th><th>Note</th>${canEditHandovers ? '<th></th>' : ''}</tr>
        ${allHistory.map(h=>`<tr>
          <td>${fmtDate(h.createdAt.slice(0,10))}</td>
          <td>${h.fromName} <span class="role-badge">${ROLE_LABELS[h.fromRole]||h.fromRole}</span></td>
          <td>${fmtMoney(h.amount)}</td>
          <td><span class="tag ${h.status==='confirmed'?'verified':'pending'}">${h.status==='confirmed'?'Confirmed':'Pending'}</span></td>
          <td>${h.confirmedBy||'—'}</td>
          <td>${h.note||'—'}</td>
          ${canEditHandovers ? `<td style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn ghost small" data-edithandover="${h.id}">Edit</button>
            <button class="btn ghost small" data-removehandover="${h.id}">Delete</button>
          </td>` : ''}
        </tr>`).join('')}
      </table>` : `<div class="empty">No handovers yet.</div>`}
      `}

    ${CASH_HANDOVER_TAB==='expenses' ? `
    <div class="panel">
      <div class="row-between">
        <h3 style="margin:0;">Expenses</h3>
        <button class="btn danger small" id="addExpenseBtn">+ Add Expense</button>

    <div class="panel">

        <button class="btn ghost small" id="exportExpensesBtn" ${expenseRows.length?'':'disabled'}>Export to Excel</button>
      </div>
      ${expensesCollapsed ? '' : `
      <p class="subtle" style="margin-bottom:10px;">Tap a column header to sort.</p>
      <input type="text" id="expenseFilterInput" placeholder="Filter by category, paid to, or note…" value="${EXPENSE_FILTER}" style="margin-bottom:10px;">
      ${expenseRows.length ? `<p style="margin-bottom:10px;"><strong>Total${EXPENSE_FILTER ? ' for "'+EXPENSE_FILTER+'"' : ''}: ${fmtMoney(expenseRows.reduce((s,l)=>s+Number(l.amount),0))}</strong> (${expenseRows.length} ${expenseRows.length===1?'entry':'entries'})</p>` : ''}
      ${expenseRows.length ? `<table>

          <th data-sortexp="date" style="cursor:pointer;">Date${expSortArrow('date')}</th>
          <th data-sortexp="category" style="cursor:pointer;">Category${expSortArrow('category')}</th>
          <th data-sortexp="amount" style="cursor:pointer;">Amount${expSortArrow('amount')}</th>
          <th>Paid to</th><th>Method</th><th>Bill #</th><th>Logged by</th><th>Note</th>
        </tr>
        ${expenseRows.map(l=>`<tr>
          <td>${fmtDate(l.date)}</td>
          <td>${l.category}</td>

          <td>${l.paidTo||'—'}</td>
          <td>${l.paymentMethod||'—'}</td>
          <td>${l.billNo||'—'}</td>
          <td>${l.loggedBy||'—'}</td>

      </table>` : `<div class="empty">${EXPENSE_FILTER ? 'No expenses match that filter.' : 'No expenses logged yet.'}</div>`}
      `}
    </div>

  `;
}

function exportHandoversCSV(){
  const handovers = DATA[SKEYS.cashHandovers].filter(h=>h.toRole==='owner').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  const headers = ['Date','From','From Role','Amount','Status','Confirmed At','Confirmed By','Note'];
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = handovers.map(h => [
    fmtDate(h.createdAt.slice(0,10)),
    h.fromName, ROLE_LABELS[h.fromRole]||h.fromRole,
    h.amount, h.status==='confirmed'?'Confirmed':'Pending',
    h.confirmedAt ? fmtDate(h.confirmedAt.slice(0,10)) : '',
    h.confirmedBy || '', h.note || '',
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cash-handovers-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportCashInflowCSV(){
  const team = DATA[SKEYS.users] || [];
  const ownerRoleIds = new Set(team.filter(t=>t.role==='owner').map(t=>t.id));
  const nozzlesForLog = DATA[SKEYS.nozzles];
  const log = [];
  DATA[SKEYS.shiftReadings]
    .filter(r => r.status === 'verified' && Number(r.cashCollected||0) > 0 && (r.verifiedByUid || r.verifiedBy))
    .forEach(r => {
      const uid = r.verifiedByUid || (team.find(t=>t.name===r.verifiedBy) || {}).id;
      const person = uid ? team.find(t=>t.id===uid) : null;
      const n = nozzlesForLog.find(x=>x.id===r.nozzleId);
      log.push({
        date: r.date, personName: person ? person.name : (r.verifiedBy || ''),
        pool: person && ownerRoleIds.has(person.id) ? "Owner's Fund" : 'Managers Fund',
        detail: n ? `Nozzle #${n.number}, ${shiftLabel(r.shift)}` : shiftLabel(r.shift),
        amount: Number(r.cashCollected||0), sortAt: r.verifiedAt || r.date,
      });
    });
  log.sort((a,b)=> new Date(a.sortAt) - new Date(b.sortAt));
  const headers = ['Date','Person','Fund','Detail','Amount'];
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = log.map(e => [fmtDate(e.date), e.personName, e.pool, e.detail, e.amount]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cash-inflow-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportExpensesCSV(){
  const filterText = EXPENSE_FILTER.trim().toLowerCase();
  let expenses = DATA[SKEYS.ledger].filter(l => l.type === 'expense');
  if (filterText){
    expenses = expenses.filter(l =>
      (l.category||'').toLowerCase().includes(filterText) ||
      (l.paidTo||'').toLowerCase().includes(filterText) ||
      (l.note||'').toLowerCase().includes(filterText) ||
      (l.billNo||'').toLowerCase().includes(filterText)
    );
  }
  expenses = [...expenses].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const headers = ['Date','Category','Amount','Paid To','Payment Method','Bill Number','Logged By','Note'];
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = expenses.map(l => [
    fmtDate(l.date), l.category, l.amount, l.paidTo||'', l.paymentMethod||'', l.billNo||'', l.loggedBy||'', l.note||'',
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `expenses-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function pageMeterReconciliation(){
  const nozzles = [...DATA[SKEYS.nozzles]].sort((a,b)=>a.number-b.number);
  return `
    <h1 class="page-title">Meter Reconciliation</h1>
    <div class="page-sub">Nozzle boy's own readings vs. the manager's independently recorded IOCL readings</div>
    ${opsHeader()}
    <div class="panel">
      <h3>Comparison — ${shiftLabel(OPS_SHIFT)}, ${fmtDate(OPS_DATE)}</h3>
      <table>
        <tr>
          <th>Nozzle</th><th>Fuel</th>
          <th>Boy: opening</th><th>Boy: closing</th><th>Boy: litres</th>
          <th>IOCL: opening</th><th>IOCL: closing</th><th>IOCL: litres</th>
          <th>Difference</th>
        </tr>
        ${nozzles.map(n=>{
          const r = getReading(n.id, OPS_DATE, OPS_SHIFT);
          const ir = getIoclReading(n.id, OPS_DATE, OPS_SHIFT);
          const boyOpen = r ? (r.status==='verified' ? r.openingVerified : r.openingSubmitted) : null;
          const boyClose = r ? (r.status==='verified' ? r.closingVerified : r.closingSubmitted) : null;
          const boyLitres = (boyOpen!=null && boyClose!=null) ? Number(boyClose) - Number(boyOpen) : null;
          const ioclLitres = (ir && ir.opening!=null && ir.closing!=null) ? Number(ir.closing) - Number(ir.opening) : null;
          let diffCell = '—', diffClass = 'manual';
          if (boyLitres!=null && ioclLitres!=null){
            const diff = Math.round((boyLitres - ioclLitres) * 100) / 100;
            diffCell = (diff===0 ? '0' : (diff>0?'+':'') + diff) + ' L';
            diffClass = diff===0 ? 'verified' : 'due';
          }
          return `<tr>
            <td>#${n.number}</td>
            <td><span class="tag ${fuelTag(n.fuelType)}">${n.fuelType}</span></td>
            <td>${boyOpen ?? '—'}</td>
            <td>${boyClose ?? '—'}</td>
            <td>${boyLitres!=null ? boyLitres.toLocaleString('en-IN') : '—'}</td>
            <td>${ir ? ir.opening : '—'}</td>
            <td>${ir && ir.closing!=null ? ir.closing : '—'}</td>
            <td>${ioclLitres!=null ? ioclLitres.toLocaleString('en-IN') : '—'}</td>
            <td><span class="tag ${diffClass}">${diffCell}</span></td>
          </tr>`;
        }).join('')}
      </table>
      <p class="subtle" style="margin-top:10px;">A nonzero difference means the nozzle boy's reading and the manager's independent IOCL reading don't agree — worth checking before relying on either for stock or accounting.</p>
    </div>
  `;
}

function showReconMismatchPopup(){
  const nozzles = [...DATA[SKEYS.nozzles]].sort((a,b)=>a.number-b.number);
  const rows = nozzles.map(n=>{
    const r = getReading(n.id, OPS_DATE, OPS_SHIFT);
    if (!r) return {n, status:'none', note:'Not checked in — no effect either way.'};
    if (r.status === 'checked-in') return {n, status:'checked-in', note:'Still mid-shift — hasn\'t checked out yet, so it contributes to neither total.'};
    if (r.status === 'pending') return {n, status:'pending', note:'Closed out but not yet given a manager checkout — its payment is already counted in "Total collected," but its litres/value won\'t count in "Total sale value" until a manager checks it out.'};
    if (r.status === 'verified') return {n, status:'verified', note:'Checked out — counted on both sides.'};
    return {n, status:'?', note:''};
  }).filter(row => row.status !== 'none' && row.status !== 'verified');

  openModal(`
    <h3>Why is there a difference?</h3>
    <p class="subtle" style="margin-bottom:12px;">${shiftLabel(OPS_SHIFT)}, ${fmtDate(OPS_DATE)}. "Total sale value" only counts <strong>verified</strong> readings. "Total collected" counts anything already <strong>checked out</strong>, verified or not. The gap between them is almost always a nozzle sitting in one state but not the other.</p>
    ${rows.length ? `<table>
      <tr><th>Nozzle</th><th>Status</th><th>Why it doesn't balance</th></tr>
      ${rows.map(row=>`<tr>
        <td>#${row.n.number}</td>
        <td><span class="tag ${readingStatusTag(row.status).cls}">${readingStatusTag(row.status).label}</span></td>
        <td>${row.note}</td>
      </tr>`).join('')}
    </table>
    <p class="subtle" style="margin-top:10px;">Go to <strong>Nozzle Operation</strong> and tap <strong>Checkout</strong> on any "Awaiting manager checkout" rows above — the difference should clear once they're all checked out.</p>`
    : `<p class="subtle">Every nozzle here is either fully verified or hasn't checked out at all — the mismatch may be from a cash-count entry rather than a checkout. Double-check the physical cash count below, or an edited/deleted reading.</p>`}
    <div class="modal-actions">
      <button type="button" class="btn ghost" onclick="closeModal()">Close</button>
    </div>
  `);
}

let OPS_REPORT_TAB = 'daily';
let PUMP_TEST_PERIOD = 'day';

function periodKeyFor(dateStr, period){
  if (period === 'day') return dateStr;
  if (period === 'year') return dateStr.slice(0,4);
  if (period === 'month') return dateStr.slice(0,7);
  // week: Monday-start
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
function periodLabelFor(key, period){
  if (period === 'day') return fmtDate(key);
  if (period === 'year') return key;
  if (period === 'month'){
    const [y,m] = key.split('-');
    return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
  }
  // week
  const start = new Date(key + 'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate()+6);
  return `${fmtDate(key)} – ${fmtDate(end.toISOString().slice(0,10))}`;
}

function testRateAndValue(t, nozzles){
  const litres = Number(t.closingReading) - Number(t.openingReading);
  let rate = t.rate;
  let estimated = false;
  if (rate == null){
    const n = nozzles.find(x=>x.id===t.nozzleId);
    const tank = n ? getTank(n.fuelType) : null;
    rate = tank ? Number(tank.rate) : 0;
    estimated = true;
  }
  return {rate, value: litres * rate, estimated};
}

function svgBarChart(items, opts){
  // items: [{label, value, color}]; opts: {width, height, valueFmt}
  const width = opts.width || 640, height = opts.height || 200;
  const padL = 46, padB = 26, padT = 10, padR = 10;
  const chartW = width - padL - padR, chartH = height - padT - padB;
  const maxVal = Math.max(1, ...items.map(i=>Math.abs(i.value)));
  const barW = chartW / items.length * 0.55;
  const gap = chartW / items.length;
  const bars = items.map((it,i)=>{
    const barH = maxVal ? (Math.abs(it.value)/maxVal) * chartH : 0;
    const x = padL + gap*i + (gap-barW)/2;
    const y = padT + (chartH - barH);
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" fill="${it.color}" rx="3"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="11" fill="var(--text)" text-anchor="middle">${opts.valueFmt ? opts.valueFmt(it.value) : it.value}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${height-padB+16}" font-size="11" fill="var(--muted)" text-anchor="middle">${it.label}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px; display:block; margin:0 auto;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${width-padR}" y2="${padT+chartH}" stroke="var(--border)" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

          const nightT = shiftTotals(d, 'night');

}

function ledgerNoteDisplay(l){
  const parts = [];
  if (l.note) parts.push(l.note);
  if (l.paidTo) parts.push('Paid to: ' + l.paidTo);

  if (l.billNo) parts.push('Bill #' + l.billNo);
  return parts.length ? parts.join(' · ') : '—';
}

function customerStatementRows(customerId){
  const tx = [...DATA[SKEYS.custTx]].filter(t=>t.customerId===customerId).sort((a,b)=>new Date(a.date)-new Date(b.date));

  return tx.map(t=>{

}

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function shareBillAsPDF(){
  const btn = document.getElementById('whatsappReportBtn');
  const originalText = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Preparing PDF…'; }
  try {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const { jsPDF } = window.jspdf;
    const sections = document.querySelectorAll('#billPrintArea .printable-report');
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 20;
    for (let i = 0; i < sections.length; i++){
      const canvas = await html2canvas(sections[i], {scale: 2, backgroundColor: '#ffffff'});
      const imgWidth = pageWidth - margin*2;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      if (i > 0) pdf.addPage();
      const imgData = canvas.toDataURL('image/png');
      if (imgHeight <= pageHeight - margin*2){
        pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);
      } else {
        // Tall section (e.g. a long annexure) — slice across extra pages.
        let renderedHeight = 0;
        let firstPage = true;
        while (renderedHeight < imgHeight){
          if (!firstPage) pdf.addPage();
          pdf.addImage(imgData, 'PNG', margin, margin - renderedHeight, imgWidth, imgHeight);
          renderedHeight += (pageHeight - margin*2);
          firstPage = false;
        }
      }
    }
    const c = DATA[SKEYS.customers].find(x=>x.id===SELECTED_CUSTOMER_ID);
    const fileName = `Bill-${c?c.name.replace(/[^a-z0-9]/gi,'_'):'customer'}-${(SELECTED_BILL_CONFIG.invoiceNo||'draft').replace(/[^a-z0-9]/gi,'_')}.pdf`;
    const pdfBlob = pdf.output('blob');
    const pdfFile = new File([pdfBlob], fileName, {type: 'application/pdf'});
    if (navigator.canShare && navigator.canShare({files: [pdfFile]})){
      await navigator.share({files: [pdfFile], title: fileName});
    } else {
      const url = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      alert('Your browser can\'t attach files straight to WhatsApp from here, so the PDF has been downloaded instead — open WhatsApp and attach it manually from your Downloads/Files.');
    }
  } catch(err){
    if (err.name !== 'AbortError') alert('Could not prepare the PDF: ' + err.message);
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = originalText || 'Send via WhatsApp (PDF)'; }
  }
}

async function seedIfEmpty(){
  if (CURRENT_USER.role === 'nozzleboy') return;
  const tankSnap = await db.collection(SKEYS.stock).limit(1).get();
  if (tankSnap.empty){
    const batch = db.batch();
    [
      {fuelType:'MS', tankCapacity: 15000, currentStock: 6800, rate: 103.50, lastUpdated: todayISO()},
      {fuelType:'HSD', tankCapacity: 20000, currentStock: 12400, rate: 91.20, lastUpdated: todayISO()},
      {fuelType:'XTRA', tankCapacity: 10000, currentStock: 4100, rate: 106.00, lastUpdated: todayISO()},
    ].forEach(t => batch.set(db.collection(SKEYS.stock).doc(), t));
    await batch.commit();
  }
  const nozzleSnap = await db.collection(SKEYS.nozzles).limit(1).get();
  if (nozzleSnap.empty){
    const layout = ['MS','MS','MS','HSD','HSD','HSD','XTRA','XTRA'];
    const batch = db.batch();
    layout.forEach((f,i)=> batch.set(db.collection(SKEYS.nozzles).doc(), {number:i+1, fuelType:f}));
    await batch.commit();
  }
  const settingsDoc = await db.collection('settings').doc('ops').get();
  if (!settingsDoc.exists){
    await fsSetSettings({dayStart:'06:00', dayEnd:'14:00', nightStart:'14:00', nightEnd:'22:00'});
  }
}

// ---------------- Real-time listeners ----------------
function startListeners(){
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
  DATA = {};
  let initialLoadDone = false;
  const pending = new Set([...COLLECTION_KEYS.map(k=>SKEYS[k]), 'settings', 'billSettings']);
  function markReady(key){
    pending.delete(key);
    if (pending.size === 0) initialLoadDone = true;
    if (initialLoadDone) render();
  }
  COLLECTION_KEYS.forEach(key=>{
    const col = SKEYS[key];
    DATA[col] = [];
    const unsub = db.collection(col).onSnapshot(snap=>{
      DATA[col] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      markReady(col);
    }, err=>{
      // Permission-denied is expected for some roles on some collections
      // (e.g. a nozzle boy can't read the ledger) — leave that data empty
      // and continue, rather than hanging on "Loading" forever.
      console.warn('No access to', col, '— continuing without it.', err.message);
      DATA[col] = [];
      markReady(col);
    });
    unsubscribers.push(unsub);
  });
  DATA[SKEYS.opsSettings] = {dayStart:'06:00', dayEnd:'14:00', nightStart:'14:00', nightEnd:'22:00'};
  const unsubSettings = db.collection('settings').doc('ops').onSnapshot(snap=>{
    if (snap.exists) DATA[SKEYS.opsSettings] = snap.data();
    markReady('settings');
  }, err=>{
    console.warn('No access to settings — continuing with defaults.', err.message);
    markReady('settings');
  });
  unsubscribers.push(unsubSettings);
  DATA[SKEYS.billSettings] = {nextInvoiceSeq: 1};
  const unsubBillSettings = db.collection('settings').doc('bill').onSnapshot(snap=>{
    if (snap.exists) DATA[SKEYS.billSettings] = {nextInvoiceSeq: 1, ...snap.data()};
    markReady('billSettings');
  }, err=>{
    console.warn('No access to bill settings — continuing with defaults.', err.message);
    markReady('billSettings');
  });
  unsubscribers.push(unsubBillSettings);
}

// ---------------- Auth state wiring ----------------
auth.onAuthStateChanged(async (user)=>{
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
  if (!user){
    CURRENT_USER = null;
    try {
      const bootstrapDoc = await db.collection('meta').doc('bootstrap').get();
      const adminExists = bootstrapDoc.exists && bootstrapDoc.data().adminExists;
      if (adminExists) renderLogin();
      else renderAdminSetup();
    } catch(err){
      // If the bootstrap check itself fails, fall back to the normal login screen.
      renderLogin();
    }
    return;
  }
  try {
    const profileDoc = await db.collection(SKEYS.users).doc(user.uid).get();
    if (!profileDoc.exists){
      CURRENT_USER = {uid: user.uid, email: user.email, name: user.email, role: null};
      renderNoProfile();
      return;
    }
    const profile = profileDoc.data();
    CURRENT_USER = {uid: user.uid, email: user.email, name: profile.name, role: profile.role,
      extraPages: profile.extraPages || [], blockedPages: profile.blockedPages || []};
    renderAppShell();
    await seedIfEmpty();
    CURRENT = pageAllowed('dashboard') ? 'dashboard' : (getNavGroups()[0]?.items[0]?.id || 'dashboard');
    startListeners();
  } catch(err){
    console.error(err);
    renderLogin('Could not load your profile: ' + err.message);
  }
});

function formCloseAllNozzles(){
  const date = todayISO();
  const shift = getCurrentShift();
  const nozzles = [...DATA[SKEYS.nozzles]].sort((a,b)=>a.number-b.number);
  const checkedIn = nozzles.filter(n => {
    const r = getReading(n.id, date, shift);
    return r && r.status === 'checked-in';
  });
  if (!checkedIn.length) return;

  const rows = checkedIn.map(n => {
    const r = getReading(n.id, date, shift);
    const tank = getTank(n.fuelType);
    const saleTotals = nozzleSaleEntryTotals(n.id, date, shift);
    const credit = nozzleCreditTotal(n.id, date, shift);
    return {n, r, tank, saleTotals, credit};
  });
  const autoUpiSum = Math.round(rows.reduce((s,x)=>s+x.saleTotals.upi,0) * 100) / 100;

  openModal(`
    <h3>Close All — Check Out</h3>
    <p class="subtle" style="margin-bottom:12px;">${shiftLabel(shift)}, ${fmtDate(date)}. Enter each nozzle's closing reading. Card and credit are pulled in automatically from what's already logged. Total UPI is pre-filled the same way, but editable — if you took UPI payments that didn't get logged individually, correct the total here and cash will adjust for you.</p>
    <form id="f">
      ${rows.map(({n,r,tank})=>`
        <div class="divider"></div>
        <p style="font-weight:600; margin-bottom:8px;">Nozzle #${n.number} (${n.fuelType}) — opening ${r.openingSubmitted}</p>
        <label>Closing meter reading</label>
        <input name="closing_${n.id}" type="number" step="0.01" required min="${r.openingSubmitted}" class="ca-closing" data-nid="${n.id}">
        <div style="height:10px;"></div>
        <label>Price per litre (₹)</label>
        <input name="rate_${n.id}" type="number" step="0.01" required min="0" value="${tank ? tank.rate : (r.rateAtCheckIn||'')}" class="ca-rate" data-nid="${n.id}">
      `).join('')}
      <div class="divider"></div>
      <label>Total UPI (₹) — across all nozzles</label>
      <input id="caUpiInput" type="number" step="0.01" min="0" value="${autoUpiSum}">
      <div class="panel" style="margin:14px 0 6px 0; padding:12px;">
        <table style="font-size:0.85rem;">
          <tr><td>Total sale value (all nozzles)</td><td style="text-align:right;" id="caValue">₹0</td></tr>
          <tr><td>− Total UPI (above)</td><td style="text-align:right;" id="caUpi">₹0</td></tr>
          <tr><td>− Card (auto, from Add Sale)</td><td style="text-align:right;" id="caCard">₹0</td></tr>
          <tr><td>− Credit (auto, from Credit Sales)</td><td style="text-align:right;" id="caCredit">₹0</td></tr>
          <tr><td><strong>= Cash to hand over</strong></td><td style="text-align:right;"><strong id="caCash">₹0</strong></td></tr>
        </table>
      </div>
      <p class="subtle" id="caTestNote" style="margin:-4px 0 10px 0; color:var(--amber-ink);"></p>
      <div class="login-error" id="caError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="caSubmitBtn" disabled>Submit — Check Out All</button>
      </div>
    </form>
  `);

  function perNozzleValues(){
    return rows.map(({n,r,saleTotals,credit}) => {
      const closing = Number(document.querySelector(`.ca-closing[data-nid="${n.id}"]`).value) || 0;
      const rate = Number(document.querySelector(`.ca-rate[data-nid="${n.id}"]`).value) || 0;
      const filled = closing >= Number(r.openingSubmitted) && document.querySelector(`.ca-closing[data-nid="${n.id}"]`).value !== '';
      const rawLitres = Math.max(0, closing - Number(r.openingSubmitted));
      const testLitres = closing > Number(r.openingSubmitted)
        ? nozzleTestLitresInRange(n.id, r.id, r.openingSubmitted, closing) : 0;
      const litres = Math.max(0, rawLitres - testLitres);
      const saleValue = litres * rate;
      return {n, r, filled, rawLitres, testLitres, saleValue, card: saleTotals.card, credit};
    });
  }

  function recalc(){
    const vals = perNozzleValues();
    const allFilled = vals.every(v=>v.filled);
    const totalValue = vals.reduce((s,v)=>s+v.saleValue,0);
    const totalTestLitres = vals.reduce((s,v)=>s+v.testLitres,0);
    const totalCard = vals.reduce((s,v)=>s+v.card,0);
    const totalCredit = vals.reduce((s,v)=>s+v.credit,0);
    const totalUpi = Number(document.getElementById('caUpiInput').value) || 0;
    const totalCash = Math.round((totalValue - totalUpi - totalCard - totalCredit) * 100) / 100;
    document.getElementById('caValue').textContent = fmtMoney(totalValue);
    document.getElementById('caTestNote').textContent = totalTestLitres > 0
      ? `${totalTestLitres.toLocaleString('en-IN')} L from a nozzle test is already excluded from the sale value above.` : '';
    document.getElementById('caUpi').textContent = fmtMoney(totalUpi);
    document.getElementById('caCard').textContent = fmtMoney(totalCard);
    document.getElementById('caCredit').textContent = fmtMoney(totalCredit);
    document.getElementById('caCash').textContent = fmtMoney(totalCash);
    document.getElementById('caCash').style.color = totalCash < 0 ? 'var(--red-ink)' : 'var(--text)';
    document.getElementById('caSubmitBtn').disabled = !allFilled;
    document.getElementById('caError').textContent = allFilled ? (totalCash < 0 ? 'Cash comes out negative — UPI/card/credit exceed the sale value. Double check your closing readings and the UPI total.' : '') : 'Fill in every nozzle\'s closing reading to continue.';
  }
  document.querySelectorAll('.ca-closing, .ca-rate').forEach(el => el.addEventListener('input', recalc));
  document.getElementById('caUpiInput').addEventListener('input', recalc);
  recalc();

  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const submitBtn = document.getElementById('caSubmitBtn');
    submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
    try {
      const vals = perNozzleValues();
      const totalValue = vals.reduce((s,v)=>s+v.saleValue,0);
      const totalUpiEntered = Number(document.getElementById('caUpiInput').value) || 0;
      let upiAllocated = 0;
      for (let i = 0; i < vals.length; i++){
        const v = vals[i];
        // Spread the collective UPI figure across nozzles by each one's share
        // of total sale value — the last nozzle absorbs any rounding remainder
        // so the per-nozzle figures always sum exactly to what was entered.
        const upi = (i === vals.length - 1)
          ? Math.round((totalUpiEntered - upiAllocated) * 100) / 100
          : Math.round((totalValue > 0 ? totalUpiEntered * (v.saleValue / totalValue) : totalUpiEntered / vals.length) * 100) / 100;
        upiAllocated += upi;
        const closing = Number(document.querySelector(`.ca-closing[data-nid="${v.n.id}"]`).value);
        const rate = Number(document.querySelector(`.ca-rate[data-nid="${v.n.id}"]`).value);
        const cash = Math.round((v.saleValue - upi - v.card - v.credit) * 100) / 100;
        await fsUpdate(SKEYS.shiftReadings, v.r.id, {
          closingSubmitted: closing, rateAtCheckOut: rate,
          cashCollected: cash, upiCollected: upi, cardCollected: v.card,
          creditAtCheckout: v.credit,
          checkOutAt: new Date().toISOString(), checkedOutBy: CURRENT_USER.name, checkedOutByUid: CURRENT_USER.uid,
          status: 'pending',
        });
      }
      closeModal(); render();
    } catch(err){
      document.getElementById('caError').textContent = err.message;
      submitBtn.disabled = false; submitBtn.textContent = 'Submit — Check Out All';
    }
  });
}

  const tank = getTank(n.fuelType);

  openModal(`
    <h3>Check out — Nozzle #${n.number} (${n.fuelType})</h3>
    <p class="subtle" style="margin-bottom:12px;">Opening was ${r.openingSubmitted}. ${shiftLabel(shift)}, ${fmtDate(date)} · ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</p>
    <p class="subtle" style="margin-bottom:12px; color:var(--amber-ink);" id="coTestNote"></p>
    <form id="f">
      <label>Closing meter reading</label>
      <input name="closing" type="number" step="0.01" required min="${r.openingSubmitted}" id="coClosing">
      <div style="height:10px;"></div>
      <label>Price per litre (₹)</label>
      <input name="rate" type="number" step="0.01" required min="0" value="${tank ? tank.rate : (r.rateAtCheckIn||'')}" id="coRate">
      <div class="divider"></div>
      <p class="subtle" style="margin-bottom:8px;">Sales breakdown — pre-filled from what you logged with "Add Sale" this shift. Adjust if anything's missing; must add up to the sale value below before you can check out.</p>
      <label>Cash (₹)</label>
      <input name="cash" type="number" step="0.01" required min="0" value="${saleTotals.cash}" id="coCash">
      <div style="height:10px;"></div>
      <label>UPI (₹)</label>
      <input name="upi" type="number" step="0.01" required min="0" value="${saleTotals.upi}" id="coUpi">
      <div style="height:10px;"></div>
      <label>Card (₹)</label>
      <input name="card" type="number" step="0.01" required min="0" value="${saleTotals.card}" id="coCard">
      <div style="height:10px;"></div>
      <label>Credit (auto — from Credit Sales logged this shift)</label>
      <input type="text" value="${fmtMoney(creditSoFar)}" disabled>
      <div class="panel" style="margin:14px 0 6px 0; padding:12px;">
        <table style="font-size:0.85rem;">
          <tr><td>Meter movement</td><td style="text-align:right;" id="coRawLitres">—</td></tr>
          <tr id="coTestRow" style="display:none;"><td>Less: nozzle test</td><td style="text-align:right;" id="coTestLitres">−0 L</td></tr>
          <tr><td>Sale value (sold litres × price)</td><td style="text-align:right;" id="coExpected">₹0</td></tr>
          <tr><td>Cash + UPI + Card + Credit</td><td style="text-align:right;" id="coEntered">₹0</td></tr>
          <tr><td><strong>Difference</strong></td><td style="text-align:right;" id="coDiff"><strong>₹0</strong></td></tr>
        </table>
      </div>
      <div class="login-error" id="coError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="coSubmitBtn" disabled>Check out</button>
      </div>
    </form>
  `);
  const closingInput = document.getElementById('coClosing');
  const rateInput = document.getElementById('coRate');
  const cashInput = document.getElementById('coCash');
  const upiInput = document.getElementById('coUpi');
  const cardInput = document.getElementById('coCard');
  const submitBtn = document.getElementById('coSubmitBtn');
  function recalc(){
    const closing = Number(closingInput.value) || 0;
    const rate = Number(rateInput.value) || 0;
    const rawLitres = Math.max(0, closing - Number(r.openingSubmitted));
    const testLitres = closing > Number(r.openingSubmitted)
      ? nozzleTestLitresInRange(n.id, r.id, r.openingSubmitted, closing) : 0;
    const litres = Math.max(0, rawLitres - testLitres);
    const expected = litres * rate;
    const entered = (Number(cashInput.value)||0) + (Number(upiInput.value)||0) + (Number(cardInput.value)||0) + creditSoFar;
    const diff = Math.round((entered - expected) * 100) / 100;
    document.getElementById('coRawLitres').textContent = rawLitres.toLocaleString('en-IN') + ' L';
    document.getElementById('coTestRow').style.display = testLitres > 0 ? '' : 'none';
    document.getElementById('coTestLitres').textContent = '−' + testLitres.toLocaleString('en-IN') + ' L';
    document.getElementById('coTestNote').textContent = testLitres > 0
      ? `${testLitres.toLocaleString('en-IN')} L from a nozzle test is automatically excluded from the sale value below.` : '';
    document.getElementById('coExpected').textContent = fmtMoney(expected);
    document.getElementById('coEntered').textContent = fmtMoney(entered);
    document.getElementById('coDiff').textContent = fmtMoney(diff);
    document.getElementById('coDiff').style.color = Math.abs(diff) < 0.01 ? 'var(--green-ink)' : 'var(--red-ink)';
    const ok = Math.abs(diff) < 0.01 && closing >= Number(r.openingSubmitted) && closingInput.value !== '';
    submitBtn.disabled = !ok;
    document.getElementById('coError').textContent = ok || closing < Number(r.openingSubmitted) ? '' : `Off by ${fmtMoney(Math.abs(diff))} — adjust cash/UPI/card to match the sale value.`;
  }
  [closingInput, rateInput, cashInput, upiInput, cardInput].forEach(el => el.addEventListener('input', recalc));
  recalc();

  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const closing = Number(fd.get('closing'));
    if (closing < Number(r.openingSubmitted)){
      alert('Closing reading cannot be less than opening reading.');
      return;
    }
    await fsUpdate(SKEYS.shiftReadings, r.id, {
      closingSubmitted: closing, rateAtCheckOut: Number(fd.get('rate')),
      cashCollected: Number(fd.get('cash')), upiCollected: Number(fd.get('upi')),
      cardCollected: Number(fd.get('card')), creditAtCheckout: creditSoFar,
      checkOutAt: new Date().toISOString(), checkedOutBy: CURRENT_USER.name, checkedOutByUid: CURRENT_USER.uid, status: 'pending',
    });
    closeModal(); render();
  });
}

async function applyReadingVerification(r, n, opening, closing){
  const tank = getTank(n.fuelType);
  const rawLitres = closing - opening;
  const testLitres = nozzleTestLitresInRange(r.nozzleId, r.id, opening, closing);
  const newLitres = rawLitres - testLitres; // net sold litres — test fuel goes back in the tank
  const oldAppliedLitres = r.appliedLitres || 0;
  const delta = newLitres - oldAppliedLitres;
  let linkedStockTxId = r.linkedStockTxId || null;
  let linkedLedgerId = r.linkedLedgerId || null;

  if (tank){
    // Atomic stock adjustment — safe even if two people verify at once
    await fsUpdate(SKEYS.stock, tank.id, {
      currentStock: FieldValue.increment(-delta),
      lastUpdated: r.date,
    });
    const saleValue = newLitres * Number(tank.rate);

    if (linkedStockTxId){
      await fsUpdate(SKEYS.stockTx, linkedStockTxId, {qty: newLitres, date: r.date});
    } else {
      linkedStockTxId = await fsAdd(SKEYS.stockTx, {
        fuelType: n.fuelType, txType: 'sale', qty: newLitres, date: r.date,
        note: `Auto — Nozzle #${n.number}, ${shiftLabel(r.shift)} (verified reading)`,
        source: 'shift', sourceReadingId: r.id, indentNo: '', dispatchNo: '',
      });
    }

    if (linkedLedgerId){
      await fsUpdate(SKEYS.ledger, linkedLedgerId, {amount: saleValue, date: r.date});
    } else {
      linkedLedgerId = await fsAdd(SKEYS.ledger, {
        type: 'income', category: `Fuel sales — Nozzle #${n.number} (${shiftLabel(r.shift)})`,
        amount: saleValue, date: r.date, note: 'Auto-posted from verified shift reading',
        source: 'shift', sourceReadingId: r.id,
      });
    }
  }

  await fsUpdate(SKEYS.shiftReadings, r.id, {
    openingVerified: opening, closingVerified: closing, status: 'verified',
    verifiedAt: new Date().toISOString(), verifiedBy: CURRENT_USER.name, verifiedByUid: CURRENT_USER.uid,
    corrected: (opening !== r.openingSubmitted) || (closing !== r.closingSubmitted),
    appliedLitres: newLitres, linkedStockTxId, linkedLedgerId,
  });
}
