<script>
  // Visible error catcher — shows any JS error directly on screen,
  // so a blank page always tells you why, without needing DevTools.
  window.addEventListener('error', function(e){
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B23A2F;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;word-break:break-word;';
    el.textContent = 'App error: ' + (e.message || (e.error && e.error.message) || 'unknown') + '\n' + (e.filename ? (e.filename + ':' + e.lineno) : '');
    document.body.appendChild(el);
  });
  window.addEventListener('unhandledrejection', function(e){
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B23A2F;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;word-break:break-word;';
    el.textContent = 'App error (promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    document.body.appendChild(el);
  });

<style>
  :root{
    --bg: #EEF1F6;
    --panel: #FFFFFF;
    --panel-2: #F5F7FB;
    --border: #DCE1EA;
    --text: #1C2333;
    --muted: #667085;
    --amber: #C7861F;
    --teal: #2E7688;
    --green: #3E8563;
    --red: #C6483C;
    --lilac: #6E62B8;
    --amber-ink: #8A5A12;
    --teal-ink: #1F5D6B;
    --green-ink: #2F6B4E;
    --red-ink: #A63B30;
    --lilac-ink: #5C4FA6;
    --sidebar-bg: #0E1930;
    --sidebar-bg-2: #16223F;
    --sidebar-border: #232F52;
    --sidebar-text: #AEB9D6;
    --sidebar-text-dim: #6E7BA0;
    --flame-1: #D6483C;
    --flame-2: #E9903C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  a, button{font-family:inherit;}

  /* ---- Shell ---- */
  .shell{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    padding:22px 12px 16px 12px;
    display:flex; flex-direction:column; gap:2px;
    overflow-y:auto;
  }
  .brand{padding:0 10px 18px 10px; border-bottom:1px solid var(--sidebar-border); margin-bottom:10px;}
  .brand .name{font-size:1.42rem; line-height:1.05; color:#fff;}
  .brand .sub{font-size:0.72rem; color:var(--flame-2); margin-top:5px; letter-spacing:0.02em;}
  .nav-group-label{
    font-size:0.68rem; letter-spacing:0.08em; color:var(--sidebar-text-dim);
    padding:14px 12px 6px 12px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:7px;
    background:transparent; border:none; color:var(--sidebar-text);
    font-size:0.9rem; text-align:left; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav-btn:hover{background:var(--sidebar-bg-2); color:#fff;}
  .nav-btn.active{
    background:linear-gradient(90deg, var(--flame-1), var(--flame-2));
    color:#fff; font-weight:600;
  }
  .nav-icon{width:18px; text-align:center; opacity:.9; flex-shrink:0;}

  .topbar{display:none;}

  main{flex:1; padding:28px 32px 60px 32px; max-width:1080px;}
  .page-title{font-size:2rem; color:var(--text); margin-bottom:4px;}
  .page-sub{color:var(--muted); font-size:0.9rem; margin-bottom:24px;}

  /* ---- Cards / panels ---- */
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:820px){
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
  }

  .stat{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:16px 18px; border-left:3px solid var(--amber);
  }
  .stat .label{font-size:0.78rem; color:var(--muted);}
  .stat .value{font-size:1.6rem; margin-top:4px; color:var(--text);}
  .stat.teal{border-left-color:var(--teal);}
  .stat.green{border-left-color:var(--green);}
  .stat.red{border-left-color:var(--red);}
  .stat.lilac{border-left-color:var(--lilac);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:18px; margin-bottom:18px;
  }
  .panel h3{font-size:1.2rem; margin-bottom:12px; color:var(--text);}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}

  table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  th{
    text-align:left; color:var(--muted); font-weight:500; font-size:0.76rem;
    padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted); font-size:0.85rem; padding:14px 4px;}

  .tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.75rem; font-weight:500;}
  .tag.hsd{background:rgba(46,118,136,.14); color:var(--teal-ink);}
  .tag.ms{background:rgba(199,134,31,.14); color:var(--amber-ink);}
  .tag.xtra{background:rgba(110,98,184,.14); color:var(--lilac-ink);}
  .tag.paid{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.due{background:rgba(198,72,60,.14); color:var(--red-ink);}
  .tag.pending{background:rgba(199,134,31,.14); color:var(--amber-ink);}
  .tag.verified{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.auto{background:rgba(62,133,99,.14); color:var(--green-ink);}
  .tag.manual{background:rgba(102,112,133,.14); color:var(--muted);}
  .shift-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .shift-tabs .btn.chip{padding:7px 14px; border-radius:20px; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); font-size:0.82rem;}
  .shift-tabs .btn.chip.active{background:var(--amber); color:#1A1206; border-color:var(--amber);}
  .field-inline{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .subtle{font-size:0.78rem; color:var(--muted);}
  .divider{height:1px; background:var(--border); margin:16px 0;}

  /* ---- Forms ---- */
  .btn{
    background:var(--amber); color:#1A1206; border:none; border-radius:6px;
    padding:9px 16px; font-size:0.88rem; font-weight:600; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.small{padding:5px 11px; font-size:0.8rem;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.danger{background:var(--red); color:#fff;}

  form.inline-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; align-items:end; margin-bottom:6px;}
  label{display:block; font-size:0.75rem; color:var(--muted); margin-bottom:5px;}
  input, select{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:8px 10px; font-size:0.87rem; font-family:inherit;
  }
  input:focus, select:focus{outline:1px solid var(--amber);}

  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px; width:100%; max-width:440px;}
  .modal h3{margin-bottom:14px;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px;}

  .section{display:none;}
  .section.active{display:block;}

  .bottom-nav{display:none;}
  @media (max-width:760px){
    .rail{
      position:fixed; top:0; left:0; bottom:0; z-index:60;
      transform:translateX(-100%); transition:transform .2s ease;
      width:250px;
    }
    .rail.open{transform:translateX(0);}
    .rail-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55;}
    .rail-scrim.open{display:block;}
    .topbar{
      display:flex; align-items:center; gap:12px;
      background:var(--sidebar-bg); border-bottom:1px solid var(--sidebar-border);
      padding:14px 16px; position:sticky; top:0; z-index:40;
    }
    .topbar .name{font-size:1.15rem; color:#fff;}
    .hamburger{
      width:34px; height:34px; border-radius:7px; border:1px solid var(--sidebar-border);
      background:var(--sidebar-bg-2); color:#fff; font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    main{padding:18px 14px 40px 14px;}
    .grid-4{grid-template-columns:1fr 1fr;}
  }

  .loading{color:var(--muted); font-size:0.85rem; padding:20px 0;}
  .printable-report{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px;}
  .report-header{border-bottom:2px solid var(--border); padding-bottom:12px;}
  .report-station{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:1.4rem;}
  .report-total{font-size:1.3rem; font-weight:700; margin:14px 0 6px 0; color:var(--red-ink);}
  @media print{
    .rail, .topbar, .no-print, .modal-bg{display:none !important;}
    main{padding:0 !important;}
    body{background:#fff !important;}
    .printable-report{border:none; padding:0; background:#fff;}
    .panel{border:1px solid #ccc; break-inside:avoid;}
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--sidebar-bg); padding:20px;}
  .login-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px 28px; width:100%; max-width:380px;}
  .login-card h1{font-size:1.6rem; color:var(--text); margin-bottom:4px;}
  .login-card .sub{color:var(--muted); font-size:0.85rem; margin-bottom:20px;}
  .login-error{color:var(--red-ink); font-size:0.82rem; margin-top:8px; min-height:1em;}
  .role-badge{font-size:0.72rem; padding:3px 9px; border-radius:20px; background:var(--panel-2); color:var(--muted); text-transform:capitalize;}
  .topbar-user{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .topbar-user .role-badge{color:#fff; background:rgba(255,255,255,.12);}
  .signout-link{color:var(--sidebar-text); font-size:0.78rem; background:none; border:none; cursor:pointer; text-decoration:underline;}
  .sidebar-user{padding:10px 12px; margin-top:auto; border-top:1px solid var(--sidebar-border); font-size:0.8rem; color:var(--sidebar-text);}
</style>

<script>
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtMoney(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits: 2}); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function todayISO() { return new Date().toISOString().slice(0,10); }

// ---------------- App state ----------------
let DATA = {};
let CURRENT = 'dashboard';

let MOBILE_NAV_OPEN = false;

const FUEL_TYPES = [
  {id:'MS', name:'MS (Petrol)', tag:'ms'},
  {id:'HSD', name:'HSD (Diesel)', tag:'hsd'},
  {id:'XTRA', name:'Xtra Green', tag:'xtra'},
];

function fuelTag(f){
  const found = FUEL_TYPES.find(x=>x.id===f);
  return found ? found.tag : 'ms';
}

// Operations page state
let OPS_DATE = todayISO();
let OPS_SHIFT = 'day';

function getTank(fuelType){ return DATA[SKEYS.stock].find(s=>s.fuelType===fuelType); }
function getReading(nozzleId, date, shift){
  return DATA[SKEYS.shiftReadings].find(r=>r.nozzleId===nozzleId && r.date===date && r.shift===shift);
}
function shiftCreditEntries(date, shift){
  return DATA[SKEYS.custTx].filter(t=>t.type==='fuel' && t.date===date && t.shift===shift);
}
function customerBalance(customerId){
  return DATA[SKEYS.custTx].filter(t=>t.customerId===customerId).reduce((s,t)=> s + (t.type==='fuel'? Number(t.amount) : -Number(t.amount)), 0);
}

function shiftTotals(date, shift){
  const nozzles = DATA[SKEYS.nozzles];
  const perFuel = {};
  FUEL_TYPES.forEach(f=> perFuel[f.id] = {litres:0, value:0});
  let cashTotal = 0, upiTotal = 0, cardTotal = 0;
  nozzles.forEach(n=>{
    const r = getReading(n.id, date, shift);
    if (r && r.status === 'verified'){
      const litres = Number(r.closingVerified) - Number(r.openingVerified);
      const tank = getTank(n.fuelType);
      const value = litres * (tank ? Number(tank.rate) : 0);
      if (!perFuel[n.fuelType]) perFuel[n.fuelType] = {litres:0, value:0};
      perFuel[n.fuelType].litres += litres;
      perFuel[n.fuelType].value += value;
    }
    if (r && (r.status === 'pending' || r.status === 'verified')){
      cashTotal += Number(r.cashCollected || 0);
      upiTotal += Number(r.upiCollected || 0);
      cardTotal += Number(r.cardCollected || 0);
    }
  });
  const totalSaleValue = Object.values(perFuel).reduce((s,v)=>s+v.value,0);
  const credits = shiftCreditEntries(date, shift);
  const totalCredit = credits.reduce((s,c)=>s+Number(c.amount),0);
  const expectedCash = totalSaleValue - totalCredit;
  const paymentBreakdown = {cash: cashTotal, upi: upiTotal, card: cardTotal, credit: totalCredit};
  const paymentBreakdownTotal = cashTotal + upiTotal + cardTotal + totalCredit;
  return {perFuel, totalSaleValue, totalCredit, expectedCash, credits, paymentBreakdown, paymentBreakdownTotal};
}

function nozzleCreditTotal(nozzleId, date, shift){
  return DATA[SKEYS.custTx]
    .filter(t=>t.type==='fuel' && t.date===date && t.shift===shift && t.nozzleId===nozzleId)
    .reduce((s,t)=>s+Number(t.amount),0);
}

function nozzleSaleEntryTotals(nozzleId, date, shift){
  const entries = DATA[SKEYS.saleEntries].filter(s=>s.nozzleId===nozzleId && s.date===date && s.shift===shift);
  return {
    cash: entries.filter(e=>e.type==='cash').reduce((s,e)=>s+Number(e.amount),0),
    upi: entries.filter(e=>e.type==='upi').reduce((s,e)=>s+Number(e.amount),0),
    card: entries.filter(e=>e.type==='card').reduce((s,e)=>s+Number(e.amount),0),
    entries,
  };
}

// ---------------- Render shell/nav ----------------
function renderNav(){
  const rail = document.getElementById('rail');
  rail.innerHTML = `
    <div class="brand">
      <div class="name display">Swapneswar<br>Filling Station</div>
      <div class="sub">Petrol · Diesel · Xtra Green</div>
    </div>
    ${getNavGroups().map(g => `
      ${g.label ? `<div class="nav-group-label">${g.label}</div>` : ''}
      ${g.items.map(n => `<button class="nav-btn ${n.id===CURRENT?'active':''}" data-nav="${n.id}"><span class="nav-icon">${n.icon}</span>${n.label}</button>`).join('')}
    `).join('')}
    <div class="sidebar-user">
      <div>${CURRENT_USER ? CURRENT_USER.name : ''}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap;">
        <span class="role-badge">${CURRENT_USER ? (ROLE_LABELS[CURRENT_USER.role]||CURRENT_USER.role) : ''}</span>
        <button class="signout-link" id="changePwBtn">Change password</button>
        <button class="signout-link" id="signOutBtn">Sign out</button>
      </div>
    </div>
  `;
  rail.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ CURRENT = btn.dataset.nav; MOBILE_NAV_OPEN = false; render(); });
  });
  rail.classList.toggle('open', MOBILE_NAV_OPEN);

  const scrim = document.getElementById('railScrim');
  scrim.classList.toggle('open', MOBILE_NAV_OPEN);
  scrim.onclick = ()=>{ MOBILE_NAV_OPEN = false; renderNav(); };

  const hamburger = document.getElementById('hamburgerBtn');
  if (hamburger) hamburger.onclick = ()=>{ MOBILE_NAV_OPEN = !MOBILE_NAV_OPEN; renderNav(); };

  const signOutBtn = document.getElementById('signOutBtn');
  if (signOutBtn) signOutBtn.onclick = ()=>{ auth.signOut(); };

  const changePwBtn = document.getElementById('changePwBtn');
  if (changePwBtn) changePwBtn.onclick = formChangePassword;
}

function formChangePassword(){
  openModal(`
    <h3>Change password</h3>
    <form id="f">
      <label>Current password</label>
      <input name="currentPassword" type="password" required autocomplete="current-password">
      <div style="height:10px;"></div>
      <label>New password</label>
      <input name="newPassword" type="text" required minlength="6" placeholder="At least 6 characters">
      <div class="login-error" id="pwFormError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn">Update password</button>
      </div>
    </form>
  `);
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, fd.get('currentPassword'));
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(fd.get('newPassword'));
      closeModal();
    } catch(err){
      document.getElementById('pwFormError').textContent = err.message;
      btn.disabled = false; btn.textContent = 'Update password';
    }
  });
}

function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

// ---------------- Pages ----------------
function pageDashboard(){
  const stock = DATA[SKEYS.stock];
  const totalStockValue = stock.reduce((s,r)=> s + r.currentStock * r.rate, 0);
  const ledger = DATA[SKEYS.ledger];
  const income = ledger.filter(l=>l.type==='income').reduce((s,l)=>s+Number(l.amount),0);
  const expense = ledger.filter(l=>l.type==='expense').reduce((s,l)=>s+Number(l.amount),0);
  const custTx = DATA[SKEYS.custTx];
  const customers = DATA[SKEYS.customers];
  const outstandingByCust = {};
  custTx.forEach(t=>{
    outstandingByCust[t.customerId] = (outstandingByCust[t.customerId]||0) + (t.type==='fuel' ? Number(t.amount) : -Number(t.amount));
  });
  const totalOutstanding = Object.values(outstandingByCust).reduce((s,v)=>s+v,0);
  const employees = DATA[SKEYS.employees];

  return `
    <h1 class="page-title">Dashboard</h1>
    <div class="page-sub">Snapshot for ${fmtDate(todayISO())}</div>

    <div class="grid grid-4" style="margin-bottom:22px;">
      <div class="stat"><div class="label">Fuel stock value</div><div class="value">${fmtMoney(totalStockValue)}</div></div>
      <div class="stat green"><div class="label">Total income recorded</div><div class="value">${fmtMoney(income)}</div></div>
      <div class="stat red"><div class="label">Total expense recorded</div><div class="value">${fmtMoney(expense)}</div></div>
      <div class="stat lilac"><div class="label">Customer credit outstanding</div><div class="value">${fmtMoney(totalOutstanding)}</div></div>
    </div>

    <div class="grid grid-2">
      <div class="panel">

            <td>${Number(s.currentStock).toLocaleString('en-IN')} L</td>

        <h3>Team &amp; accounts at a glance</h3>
        <table>

        <tr><th>Nozzle</th><th>Fuel</th><th>Shift</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Sale value</th><th>Status</th></tr>
        ${[...DATA[SKEYS.nozzles]].sort((a,b)=>a.number-b.number).flatMap(n=>['day','night'].map(sh=>{
          const r = getReading(n.id, todayISO(), sh);
          if (!r) return null;
          const opening = r.status==='verified' ? r.openingVerified : r.openingSubmitted;
          const closing = r.status==='verified' ? r.closingVerified : r.closingSubmitted;
          const litres = r.status==='verified' ? (Number(r.closingVerified)-Number(r.openingVerified)) : null;
          const tank = getTank(n.fuelType);
          const value = litres!=null && tank ? litres * Number(tank.rate) : null;
          const st = readingStatusTag(r.status);
          return `<tr>
            <td>#${n.number}</td>
            <td><span class="tag ${fuelTag(n.fuelType)}">${n.fuelType}</span></td>
            <td>${shiftLabel(sh)}</td>

            <td>${closing ?? '—'}</td>
            <td>${litres!=null ? Number(litres).toLocaleString('en-IN') : '—'}</td>
            <td>${value!=null ? fmtMoney(value) : '—'}</td>
            <td><span class="tag ${st.cls}">${st.label}</span></td>
          </tr>`;
        })).filter(Boolean).join('') || `<tr><td colspan="8" class="empty">No nozzle activity yet today.</td></tr>`}
      </table>
    </div>
  `;
}

function shiftLabel(s){ return s === 'day' ? 'Day shift' : 'Night shift'; }

function getCurrentShift(){
  const s = DATA[SKEYS.opsSettings];
  const toMins = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };
  const nowMins = new Date().getHours()*60 + new Date().getMinutes();
  const dayStart = toMins(s.dayStart), dayEnd = toMins(s.dayEnd);
  if (dayStart < dayEnd) return (nowMins >= dayStart && nowMins < dayEnd) ? 'day' : 'night';
  // handles a day window that itself wraps past midnight
  return (nowMins >= dayStart || nowMins < dayEnd) ? 'day' : 'night';
}

function readingStatusTag(status){
  if (status === 'verified') return {label:'Verified', cls:'verified'};
  if (status === 'pending') return {label:'Checked out — awaiting verification', cls:'pending'};
  if (status === 'checked-in') return {label:'Checked in', cls:'pending'};
  return {label:'Not checked in', cls:'manual'};
}

function svgBarChart(items, opts){
  // items: [{label, value, color}]; opts: {width, height, valueFmt}
  const width = opts.width || 640, height = opts.height || 200;
  const padL = 46, padB = 26, padT = 10, padR = 10;
  const chartW = width - padL - padR, chartH = height - padT - padB;
  const maxVal = Math.max(1, ...items.map(i=>Math.abs(i.value)));
  const barW = chartW / items.length * 0.55;
  const gap = chartW / items.length;
  const bars = items.map((it,i)=>{
    const barH = maxVal ? (Math.abs(it.value)/maxVal) * chartH : 0;
    const x = padL + gap*i + (gap-barW)/2;
    const y = padT + (chartH - barH);
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" fill="${it.color}" rx="3"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="11" fill="var(--text)" text-anchor="middle">${opts.valueFmt ? opts.valueFmt(it.value) : it.value}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${height-padB+16}" font-size="11" fill="var(--muted)" text-anchor="middle">${it.label}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px; display:block; margin:0 auto;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${width-padR}" y2="${padT+chartH}" stroke="var(--border)" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN', {month:'short', year:'numeric'});
}

function pageReports(){
  if (!REPORT_FROM){
    const d = new Date(); d.setDate(d.getDate()-30);
    REPORT_FROM = d.toISOString().slice(0,10);
    REPORT_TO = todayISO();
  }
  const ledgerAll = DATA[SKEYS.ledger];
  const ledger = ledgerAll.filter(l=>l.date>=REPORT_FROM && l.date<=REPORT_TO);
  const income = ledger.filter(l=>l.type==='income').reduce((s,l)=>s+Number(l.amount),0);
  const expense = ledger.filter(l=>l.type==='expense').reduce((s,l)=>s+Number(l.amount),0);

  // Monthly P&L
  const monthMap = {};
  ledger.forEach(l=>{
    const mk = monthKey(l.date);
    if (!monthMap[mk]) monthMap[mk] = {income:0, expense:0};
    monthMap[mk][l.type] += Number(l.amount);
  });
  const months = Object.keys(monthMap).sort();

  // Fuel-wise trends (from verified shift readings in range)
  const readings = DATA[SKEYS.shiftReadings].filter(r=>r.status==='verified' && r.date>=REPORT_FROM && r.date<=REPORT_TO);
  const fuelAgg = {};
  FUEL_TYPES.forEach(f=> fuelAgg[f.id] = {litres:0, value:0});
  readings.forEach(r=>{
    const n = DATA[SKEYS.nozzles].find(x=>x.id===r.nozzleId);
    if (!n) return;
    const tank = getTank(n.fuelType);
    const litres = Number(r.closingVerified) - Number(r.openingVerified);
    if (!fuelAgg[n.fuelType]) fuelAgg[n.fuelType] = {litres:0, value:0};
    fuelAgg[n.fuelType].litres += litres;
    fuelAgg[n.fuelType].value += litres * (tank ? Number(tank.rate) : 0);
  });

  const fuelColorVar = {MS:'var(--amber)', HSD:'var(--teal)', XTRA:'var(--lilac)'};
  const litresChart = svgBarChart(
    FUEL_TYPES.map(f=>({label:f.id, value: Math.round(fuelAgg[f.id]?.litres||0), color: fuelColorVar[f.id]||'var(--muted)'})),
    {valueFmt:(v)=>v.toLocaleString('en-IN')+'L'}
  );
  const monthChart = months.length ? svgBarChart(
    months.map(mk=>({label: monthLabel(mk).split(' ')[0], value: Math.round(monthMap[mk].income - monthMap[mk].expense), color: (monthMap[mk].income-monthMap[mk].expense)>=0 ? 'var(--green)' : 'var(--red)'})),
    {valueFmt:(v)=>'₹'+Math.round(v/1000)+'k'}
  ) : '';

  const dates = [...new Set(readings.map(r=>r.date))].sort((a,b)=>new Date(b)-new Date(a));
  const gstLedger = ledgerAll.filter(l=>l.gstApplicable);
  const gstTotal = gstLedger.reduce((s,l)=>s+Number(l.amount),0);

  return `
    <h1 class="page-title">Reports</h1>
    <div class="page-sub">Business summary for the selected period</div>

    <div class="panel">
      <div class="field-inline">
        <div><label>From</label><input type="date" id="reportFromInput" value="${REPORT_FROM}"></div>
        <div><label>To</label><input type="date" id="reportToInput" value="${REPORT_TO}"></div>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="stat green"><div class="label">Income (period)</div><div class="value">${fmtMoney(income)}</div></div>
      <div class="stat red"><div class="label">Expense (period)</div><div class="value">${fmtMoney(expense)}</div></div>
      <div class="stat"><div class="label">Net position</div><div class="value">${fmtMoney(income-expense)}</div></div>
    </div>

    <div class="panel">
      <h3>Monthly P&amp;L</h3>
      ${months.length ? `
        ${monthChart}
        <div style="height:8px;"></div>
        <table>
          <tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr>
          ${months.map(mk=>`<tr>
            <td>${monthLabel(mk)}</td>
            <td>${fmtMoney(monthMap[mk].income)}</td>
            <td>${fmtMoney(monthMap[mk].expense)}</td>
            <td><span class="tag ${(monthMap[mk].income-monthMap[mk].expense)>=0?'paid':'due'}">${fmtMoney(monthMap[mk].income-monthMap[mk].expense)}</span></td>
          </tr>`).join('')}
        </table>
      ` : `<div class="empty">No ledger entries in this period.</div>`}
    </div>

    <div class="panel">
      <h3>Fuel-wise sales — litres sold</h3>
      ${readings.length ? `
        ${litresChart}
        <div style="height:8px;"></div>
        <table>
          <tr><th>Fuel</th><th>Litres sold</th><th>Sale value</th></tr>
          ${FUEL_TYPES.map(f=>`<tr>

function customerStatementRows(customerId){
  const tx = [...DATA[SKEYS.custTx]].filter(t=>t.customerId===customerId).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let running = 0;
  return tx.map(t=>{
    running += (t.type==='fuel' ? Number(t.amount) : -Number(t.amount));
    return {...t, runningBalance: running};
  });
}

  return CURRENT_USER && ['admin','owner','manager'].includes(CURRENT_USER.role);
}

function pageAllowed(pageId){
  if (!CURRENT_USER) return false;
  const allowed = ROLE_PAGE_ACCESS[CURRENT_USER.role];
  return allowed === null || allowed === undefined ? true : allowed.includes(pageId);
}

// ---------------- Firestore CRUD helpers ----------------
async function fsAdd(col, data){
  const ref = await db.collection(col).add(data);
  return ref.id;
}
async function fsUpdate(col, id, data){
  await db.collection(col).doc(id).update(data);
}
async function fsDelete(col, id){
  await db.collection(col).doc(id).delete();
}
async function fsSetSettings(data){
  await db.collection('settings').doc('ops').set(data, {merge:true});
}
const FieldValue = firebase.firestore.FieldValue;

// ---------------- Seed default data (owner/manager only, runs once) ----------------
async function seedIfEmpty(){
  if (CURRENT_USER.role === 'nozzleboy') return;
  const tankSnap = await db.collection(SKEYS.stock).limit(1).get();
  if (tankSnap.empty){
    const batch = db.batch();
    [
      {fuelType:'MS', tankCapacity: 15000, currentStock: 6800, rate: 103.50, lastUpdated: todayISO()},
      {fuelType:'HSD', tankCapacity: 20000, currentStock: 12400, rate: 91.20, lastUpdated: todayISO()},
      {fuelType:'XTRA', tankCapacity: 10000, currentStock: 4100, rate: 106.00, lastUpdated: todayISO()},
    ].forEach(t => batch.set(db.collection(SKEYS.stock).doc(), t));
    await batch.commit();
  }
  const nozzleSnap = await db.collection(SKEYS.nozzles).limit(1).get();
  if (nozzleSnap.empty){
    const layout = ['MS','MS','MS','HSD','HSD','HSD','XTRA','XTRA'];
    const batch = db.batch();
    layout.forEach((f,i)=> batch.set(db.collection(SKEYS.nozzles).doc(), {number:i+1, fuelType:f}));
    await batch.commit();
  }
  const settingsDoc = await db.collection('settings').doc('ops').get();
  if (!settingsDoc.exists){
    await fsSetSettings({dayStart:'06:00', dayEnd:'14:00', nightStart:'14:00', nightEnd:'22:00'});
  }
}

// ---------------- Real-time listeners ----------------
function startListeners(){
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
  DATA = {};
  let initialLoadDone = false;
  const pending = new Set([...COLLECTION_KEYS.map(k=>SKEYS[k]), 'settings']);
  function markReady(key){
    pending.delete(key);
    if (pending.size === 0) initialLoadDone = true;
    if (initialLoadDone) render();
  }
  COLLECTION_KEYS.forEach(key=>{
    const col = SKEYS[key];
    DATA[col] = [];
    const unsub = db.collection(col).onSnapshot(snap=>{
      DATA[col] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      markReady(col);
    }, err=>{
      // Permission-denied is expected for some roles on some collections
      // (e.g. a nozzle boy can't read the ledger) — leave that data empty
      // and continue, rather than hanging on "Loading" forever.
      console.warn('No access to', col, '— continuing without it.', err.message);
      DATA[col] = [];
      markReady(col);
    });
    unsubscribers.push(unsub);
  });
  DATA[SKEYS.opsSettings] = {dayStart:'06:00', dayEnd:'14:00', nightStart:'14:00', nightEnd:'22:00'};
  const unsubSettings = db.collection('settings').doc('ops').onSnapshot(snap=>{
    if (snap.exists) DATA[SKEYS.opsSettings] = snap.data();
    markReady('settings');
  }, err=>{
    console.warn('No access to settings — continuing with defaults.', err.message);
    markReady('settings');
  });
  unsubscribers.push(unsubSettings);
}

const LOGIN_DOMAIN = 'swapneswar.local'; // usernames become username@swapneswar.local internally
function usernameToAuthEmail(username){
  return username.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@' + LOGIN_DOMAIN;
}

  const preview = document.getElementById('setupUsernamePreview');

      await db.collection(SKEYS.users).doc(uid).set({
        name: fd.get('name'), role: 'admin', username: fd.get('username').trim().toLowerCase(),
      });
      await db.collection('meta').doc('bootstrap').set({adminExists: true});
      // onAuthStateChanged will pick up the new session automatically from here.
    } catch(err){
      renderAdminSetup(err.message);
    }
  });

// ---------------- Auth state wiring ----------------
auth.onAuthStateChanged(async (user)=>{
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
  if (!user){
    CURRENT_USER = null;
    try {
      const bootstrapDoc = await db.collection('meta').doc('bootstrap').get();
      const adminExists = bootstrapDoc.exists && bootstrapDoc.data().adminExists;
      if (adminExists) renderLogin();
      else renderAdminSetup();
    } catch(err){
      // If the bootstrap check itself fails, fall back to the normal login screen.
      renderLogin();
    }
    return;
  }
  try {
    const profileDoc = await db.collection(SKEYS.users).doc(user.uid).get();
    if (!profileDoc.exists){
      CURRENT_USER = {uid: user.uid, email: user.email, name: user.email, role: null};
      renderNoProfile();
      return;
    }
    const profile = profileDoc.data();
    CURRENT_USER = {uid: user.uid, email: user.email, name: profile.name, role: profile.role};
    renderAppShell();
    await seedIfEmpty();
    CURRENT = pageAllowed('dashboard') ? 'dashboard' : (getNavGroups()[0]?.items[0]?.id || 'dashboard');
    startListeners();
  } catch(err){
    console.error(err);
    renderLogin('Could not load your profile: ' + err.message);
  }
});

function formAddSaleCredit(nozzleId, amount, date, shift){
  const n = DATA[SKEYS.nozzles].find(x=>x.id===nozzleId);
  const customers = DATA[SKEYS.customers];
  openModal(`
    <h3>Credit sale — Nozzle #${n.number}</h3>
    <p class="subtle" style="margin-bottom:12px;">${fmtMoney(amount)}</p>
    <form id="f">
      <label>Customer</label>
      ${customers.length ? `
        <select name="customerId">${customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      ` : `<p class="subtle">No customers on file yet — ask a manager to add one before logging a credit sale.</p>`}
      <div style="height:10px;"></div>
      <label>Vehicle number</label>
      <input name="vehicleNumber" type="text" placeholder="e.g. MH12 AB 1234" required>
      <div style="height:10px;"></div>
      <label>Note (optional)</label>
      <input name="note" type="text">
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="formAddSale()">Back</button>
        <button type="submit" class="btn" ${customers.length ? '' : 'disabled'}>Save credit sale</button>
      </div>
    </form>
  `);
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const customerId = fd.get('customerId');
    const cust = customers.find(c=>c.id===customerId);
    if (cust && cust.creditLimit > 0){
      const bal = customerBalance(customerId);
      if ((bal + amount) > cust.creditLimit){
        const proceed = confirm(`This will take ${cust.name} to ${fmtMoney(bal+amount)}, over their ${fmtMoney(cust.creditLimit)} credit limit. Log it anyway?`);
        if (!proceed) return;
      }
    }
    await fsAdd(SKEYS.custTx, {
      customerId, type: 'fuel', amount, date, shift, nozzleId,
      vehicleNumber: fd.get('vehicleNumber'), note: fd.get('note'), loggedBy: CURRENT_USER.name,
    });
    closeModal(); render();
  });
}

function formCheckOutDetails(nozzleId, date, shift){
  const n = DATA[SKEYS.nozzles].find(x=>x.id===nozzleId);
  const r = getReading(nozzleId, date, shift);
  const tank = getTank(n.fuelType);
  const now = new Date();
  const creditSoFar = nozzleCreditTotal(nozzleId, date, shift);
  const saleTotals = nozzleSaleEntryTotals(nozzleId, date, shift);
  openModal(`
    <h3>Check out — Nozzle #${n.number} (${n.fuelType})</h3>
    <p class="subtle" style="margin-bottom:12px;">Opening was ${r.openingSubmitted}. ${shiftLabel(shift)}, ${fmtDate(date)} · ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</p>
    <form id="f">
      <label>Closing meter reading</label>
      <input name="closing" type="number" step="0.01" required min="${r.openingSubmitted}" id="coClosing">
      <div style="height:10px;"></div>
      <label>Price per litre (₹)</label>
      <input name="rate" type="number" step="0.01" required min="0" value="${tank ? tank.rate : (r.rateAtCheckIn||'')}" id="coRate">
      <div class="divider"></div>
      <p class="subtle" style="margin-bottom:8px;">Sales breakdown — pre-filled from what you logged with "Add Sale" this shift. Adjust if anything's missing; must add up to the sale value below before you can check out.</p>
      <label>Cash (₹)</label>
      <input name="cash" type="number" step="0.01" required min="0" value="${saleTotals.cash}" id="coCash">
      <div style="height:10px;"></div>
      <label>UPI (₹)</label>
      <input name="upi" type="number" step="0.01" required min="0" value="${saleTotals.upi}" id="coUpi">
      <div style="height:10px;"></div>
      <label>Card (₹)</label>
      <input name="card" type="number" step="0.01" required min="0" value="${saleTotals.card}" id="coCard">
      <div style="height:10px;"></div>
      <label>Credit (auto — from Credit Sales logged this shift)</label>
      <input type="text" value="${fmtMoney(creditSoFar)}" disabled>
      <div class="panel" style="margin:14px 0 6px 0; padding:12px;">
        <table style="font-size:0.85rem;">
          <tr><td>Sale value (litres × price)</td><td style="text-align:right;" id="coExpected">₹0</td></tr>
          <tr><td>Cash + UPI + Card + Credit</td><td style="text-align:right;" id="coEntered">₹0</td></tr>
          <tr><td><strong>Difference</strong></td><td style="text-align:right;" id="coDiff"><strong>₹0</strong></td></tr>
        </table>
      </div>
      <div class="login-error" id="coError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="coSubmitBtn" disabled>Check out</button>
      </div>
    </form>
  `);
  const closingInput = document.getElementById('coClosing');
  const rateInput = document.getElementById('coRate');
  const cashInput = document.getElementById('coCash');
  const upiInput = document.getElementById('coUpi');
  const cardInput = document.getElementById('coCard');
  const submitBtn = document.getElementById('coSubmitBtn');
  function recalc(){
    const closing = Number(closingInput.value) || 0;
    const rate = Number(rateInput.value) || 0;
    const litres = Math.max(0, closing - Number(r.openingSubmitted));
    const expected = litres * rate;
    const entered = (Number(cashInput.value)||0) + (Number(upiInput.value)||0) + (Number(cardInput.value)||0) + creditSoFar;
    const diff = Math.round((entered - expected) * 100) / 100;
    document.getElementById('coExpected').textContent = fmtMoney(expected);
    document.getElementById('coEntered').textContent = fmtMoney(entered);
    document.getElementById('coDiff').textContent = fmtMoney(diff);
    document.getElementById('coDiff').style.color = Math.abs(diff) < 0.01 ? 'var(--green-ink)' : 'var(--red-ink)';
    const ok = Math.abs(diff) < 0.01 && closing > Number(r.openingSubmitted);
    submitBtn.disabled = !ok;
    document.getElementById('coError').textContent = ok || closing <= Number(r.openingSubmitted) ? '' : `Off by ${fmtMoney(Math.abs(diff))} — adjust cash/UPI/card to match the sale value.`;
  }
  [closingInput, rateInput, cashInput, upiInput, cardInput].forEach(el => el.addEventListener('input', recalc));
  recalc();

  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const closing = Number(fd.get('closing'));
    if (closing < Number(r.openingSubmitted)){
      alert('Closing reading cannot be less than opening reading.');
      return;
    }
    await fsUpdate(SKEYS.shiftReadings, r.id, {
      closingSubmitted: closing, rateAtCheckOut: Number(fd.get('rate')),
      cashCollected: Number(fd.get('cash')), upiCollected: Number(fd.get('upi')),
      cardCollected: Number(fd.get('card')), creditAtCheckout: creditSoFar,
      checkOutAt: new Date().toISOString(), status: 'pending',
    });
    closeModal(); render();
  });
}

async function applyReadingVerification(r, n, opening, closing){
  const tank = getTank(n.fuelType);
  const newLitres = closing - opening;
  const oldAppliedLitres = r.appliedLitres || 0;
  const delta = newLitres - oldAppliedLitres;
  let linkedStockTxId = r.linkedStockTxId || null;
  let linkedLedgerId = r.linkedLedgerId || null;

  if (tank){
    // Atomic stock adjustment — safe even if two people verify at once
    await fsUpdate(SKEYS.stock, tank.id, {
      currentStock: FieldValue.increment(-delta),
      lastUpdated: r.date,
    });
    const saleValue = newLitres * Number(tank.rate);

    if (linkedStockTxId){
      await fsUpdate(SKEYS.stockTx, linkedStockTxId, {qty: newLitres, date: r.date});
    } else {
      linkedStockTxId = await fsAdd(SKEYS.stockTx, {
        fuelType: n.fuelType, txType: 'sale', qty: newLitres, date: r.date,
        note: `Auto — Nozzle #${n.number}, ${shiftLabel(r.shift)} (verified reading)`,
        source: 'shift', sourceReadingId: r.id, indentNo: '', dispatchNo: '',
      });
    }

    if (linkedLedgerId){
      await fsUpdate(SKEYS.ledger, linkedLedgerId, {amount: saleValue, date: r.date});
    } else {
      linkedLedgerId = await fsAdd(SKEYS.ledger, {
        type: 'income', category: `Fuel sales — Nozzle #${n.number} (${shiftLabel(r.shift)})`,
        amount: saleValue, date: r.date, note: 'Auto-posted from verified shift reading',
        source: 'shift', sourceReadingId: r.id,
      });
    }
  }

  await fsUpdate(SKEYS.shiftReadings, r.id, {
    openingVerified: opening, closingVerified: closing, status: 'verified',
    verifiedAt: new Date().toISOString(), verifiedBy: CURRENT_USER.name,
    corrected: (opening !== r.openingSubmitted) || (closing !== r.closingSubmitted),
    appliedLitres: newLitres, linkedStockTxId, linkedLedgerId,

function formManagerAddReading(){

  }
  openModal(`
    <h3>Add reading</h3>
    <p class="subtle" style="margin-bottom:12px;">${shiftLabel(OPS_SHIFT)}, ${fmtDate(OPS_DATE)} — enter both meter readings directly; the system reconciles stock and accounts automatically.</p>
    <form id="f">
      <label>Nozzle</label>
      <select name="nozzleId" id="marNozzle">${available.map(n=>`<option value="${n.id}" data-fuel="${n.fuelType}">#${n.number} — ${n.fuelType}</option>`).join('')}</select>
      <div style="height:10px;"></div>
      <label>Opening meter reading</label>
      <input name="opening" type="number" step="0.01" required min="0" id="marOpening">
      <div style="height:10px;"></div>
      <label>Closing meter reading</label>
      <input name="closing" type="number" step="0.01" required min="0" id="marClosing">
      <div style="height:10px;"></div>
      <label>Price per litre (₹)</label>
      <input name="rate" type="number" step="0.01" required min="0" id="marRate">
      <div class="divider"></div>
      <p class="subtle" style="margin-bottom:8px;">Sales breakdown — must add up to the sale value below.</p>
      <label>Cash (₹)</label>
      <input name="cash" type="number" step="0.01" required min="0" value="0" id="marCash">
      <div style="height:10px;"></div>
      <label>UPI (₹)</label>
      <input name="upi" type="number" step="0.01" required min="0" value="0" id="marUpi">
      <div style="height:10px;"></div>
      <label>Card (₹)</label>
      <input name="card" type="number" step="0.01" required min="0" value="0" id="marCard">
      <div style="height:10px;"></div>
      <label>Credit (auto — from Credit Sales logged this shift)</label>
      <input type="text" id="marCreditDisplay" value="₹0" disabled>
      <div class="panel" style="margin:14px 0 6px 0; padding:12px;">
        <table style="font-size:0.85rem;">
          <tr><td>Sale value (litres × price)</td><td style="text-align:right;" id="marExpected">₹0</td></tr>
          <tr><td>Cash + UPI + Card + Credit</td><td style="text-align:right;" id="marEntered">₹0</td></tr>
          <tr><td><strong>Difference</strong></td><td style="text-align:right;" id="marDiff"><strong>₹0</strong></td></tr>
        </table>
      </div>
      <div class="login-error" id="marError"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="marSubmitBtn" disabled>Save &amp; verify</button>
      </div>
    </form>
  `);
  const nozzleSel = document.getElementById('marNozzle');
  const openingInput = document.getElementById('marOpening');
  const closingInput = document.getElementById('marClosing');
  const rateInput = document.getElementById('marRate');
  const cashInput = document.getElementById('marCash');
  const upiInput = document.getElementById('marUpi');
  const cardInput = document.getElementById('marCard');
  const submitBtn = document.getElementById('marSubmitBtn');

  function creditForSelection(){
    const nozzleId = nozzleSel.value;
    return nozzleCreditTotal(nozzleId, OPS_DATE, OPS_SHIFT);
  }
  function syncRateAndCredit(){
    const opt = nozzleSel.selectedOptions[0];
    const fuelType = opt ? opt.dataset.fuel : null;
    const tank = fuelType ? getTank(fuelType) : null;
    if (tank) rateInput.value = tank.rate;
    document.getElementById('marCreditDisplay').value = fmtMoney(creditForSelection());
    recalc();
  }
  function recalc(){
    const opening = Number(openingInput.value) || 0;
    const closing = Number(closingInput.value) || 0;
    const rate = Number(rateInput.value) || 0;
    const litres = Math.max(0, closing - opening);
    const expected = litres * rate;
    const credit = creditForSelection();
    const entered = (Number(cashInput.value)||0) + (Number(upiInput.value)||0) + (Number(cardInput.value)||0) + credit;
    const diff = Math.round((entered - expected) * 100) / 100;
    document.getElementById('marExpected').textContent = fmtMoney(expected);
    document.getElementById('marEntered').textContent = fmtMoney(entered);
    document.getElementById('marDiff').textContent = fmtMoney(diff);
    document.getElementById('marDiff').style.color = Math.abs(diff) < 0.01 ? 'var(--green-ink)' : 'var(--red-ink)';
    const ok = Math.abs(diff) < 0.01 && closing > opening;
    submitBtn.disabled = !ok;
    document.getElementById('marError').textContent = ok || closing <= opening ? '' : `Off by ${fmtMoney(Math.abs(diff))} — adjust cash/UPI/card to match the sale value.`;
  }
  nozzleSel.addEventListener('change', syncRateAndCredit);
  [openingInput, closingInput, rateInput, cashInput, upiInput, cardInput].forEach(el => el.addEventListener('input', recalc));
  syncRateAndCredit();

  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const nozzleId = fd.get('nozzleId');
    const n = DATA[SKEYS.nozzles].find(x=>x.id===nozzleId);
    const opening = Number(fd.get('opening'));
    const closing = Number(fd.get('closing'));
    if (closing <= opening){
      alert('Closing reading must be greater than opening reading.');
      return;
    }
    const credit = creditForSelection();
    const newId = await fsAdd(SKEYS.shiftReadings, {
      date: OPS_DATE, shift: OPS_SHIFT, nozzleId,
      openingSubmitted: opening, closingSubmitted: closing,
      rateAtCheckIn: Number(fd.get('rate')), rateAtCheckOut: Number(fd.get('rate')),
      cashInHand: null, cashCollected: Number(fd.get('cash')), upiCollected: Number(fd.get('upi')),
      cardCollected: Number(fd.get('card')), creditAtCheckout: credit,
      checkInAt: new Date().toISOString(), checkOutAt: new Date().toISOString(),
      checkedInBy: CURRENT_USER.name,
      submittedAt: new Date().toISOString(), submittedBy: CURRENT_USER.name, status: 'pending',
      openingVerified: null, closingVerified: null, verifiedAt: null, verifiedBy: null, corrected: false,
      appliedLitres: 0, linkedStockTxId: null, linkedLedgerId: null,
    });
    const rLocal = {id: newId, date: OPS_DATE, shift: OPS_SHIFT, appliedLitres: 0,
      openingSubmitted: opening, closingSubmitted: closing, linkedStockTxId: null, linkedLedgerId: null};
    await applyReadingVerification(rLocal, n, opening, closing);
    closeModal(); render();
  });
}

function formCustTx(custId, presetType){
  const c = DATA[SKEYS.customers].find(x=>x.id===custId);
  const bal = customerBalance(custId);
  const initialType = presetType || 'fuel';
  openModal(`
    <h3>${presetType==='payment' ? 'Record payment' : presetType==='fuel' ? 'Log credit sale' : 'Add transaction'} — ${c.name}</h3>
    <p class="subtle" style="margin-bottom:12px;">Current balance: ${fmtMoney(bal)}${c.creditLimit>0 ? ` · Limit: ${fmtMoney(c.creditLimit)}` : ''}</p>
    <form id="f">
      ${presetType ? `<input type="hidden" name="type" value="${presetType}">` : `
      <label>Type</label>
      <select name="type" id="custTxType"><option value="fuel">Fuel taken on credit</option><option value="payment">Payment received</option></select>
      <div style="height:10px;"></div>
      `}
      <div id="vehicleField" style="display:${initialType==='fuel'?'block':'none'};">
        <label>Vehicle number</label>
        <input name="vehicleNumber" type="text" placeholder="e.g. MH12 AB 1234">
        <div style="height:10px;"></div>
      </div>
      <label>Amount (₹)</label>
      <input name="amount" type="number" required min="0" value="${presetType==='payment' && bal>0 ? bal : ''}">
      <div style="height:10px;"></div>
      <label>Date</label>
      <input name="date" type="date" value="${todayISO()}" required>
      <div style="height:10px;"></div>
      <label>Note (optional)</label>
      <input name="note" type="text" placeholder="e.g. Invoice #">
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn">Save transaction</button>
      </div>
    </form>
  `);
  const typeSel = document.getElementById('custTxType');
  const vehicleField = document.getElementById('vehicleField');
  if (typeSel){
    typeSel.addEventListener('change', ()=>{
      vehicleField.style.display = typeSel.value === 'fuel' ? 'block' : 'none';
    });
  }
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const type = fd.get('type');
    const amount = Number(fd.get('amount'));
    if (type === 'fuel' && c.creditLimit > 0 && (bal + amount) > c.creditLimit){
      const proceed = confirm(`This will take ${c.name} to ${fmtMoney(bal+amount)}, over their ${fmtMoney(c.creditLimit)} credit limit. Log it anyway?`);
      if (!proceed) return;
    }
    await fsAdd(SKEYS.custTx, {
      customerId: custId, type, amount,
      date: fd.get('date'), note: fd.get('note'),
      vehicleNumber: type==='fuel' ? fd.get('vehicleNumber') : '',
      loggedBy: CURRENT_USER.name,
    });
    closeModal(); render();
  });
}

// ---------------- Account creation (secondary app instance so the
// admin's own session isn't replaced by the new user's session) ----------------
function getSecondaryAuth(){
  let secApp;
  try { secApp = firebase.app('Secondary'); }
  catch(e){ secApp = firebase.initializeApp(firebaseConfig, 'Secondary'); }
  return secApp.auth();
}

async function createLogin({email, password, name, role, employeeId}){
  const secAuth = getSecondaryAuth();
  const cred = await secAuth.createUserWithEmailAndPassword(email, password);
  const newUid = cred.user.uid;
  await secAuth.signOut();
  const username = email.endsWith('@'+LOGIN_DOMAIN) ? email.slice(0, -('@'+LOGIN_DOMAIN).length) : email;
  await db.collection(SKEYS.users).doc(newUid).set({name, role, username});
  if (employeeId){
    await fsUpdate(SKEYS.employees, employeeId, {linkedUid: newUid, loginEmail: email});
  }
  return newUid;
}

// ---------------- Render dispatcher ----------------
function render(){
  if (!CURRENT_USER) return;
  if (!pageAllowed(CURRENT)){
    CURRENT = getNavGroups()[0]?.items[0]?.id || 'dashboard';
  }
  renderNav();
  const main = document.getElementById('main');
  let html = '';
  if (CURRENT === 'dashboard') html = pageDashboard();
  else if (CURRENT === 'ops-readings') html = pageOpsReadings();
  else if (CURRENT === 'ops-credit') html = pageOpsCredit();
  else if (CURRENT === 'ops-recon') html = pageOpsRecon();
  else if (CURRENT === 'ops-report') html = pageOpsReport();
  else if (CURRENT === 'stock') html = pageStock();
  else if (CURRENT === 'hr') html = pageHR();
  else if (CURRENT === 'accounting') html = pageAccounting();
  else if (CURRENT === 'customers') html = pageCustomers();
  else if (CURRENT === 'customer-detail') html = pageCustomerDetail();
  else if (CURRENT === 'customer-report') html = pageCustomerReport();
  else if (CURRENT === 'reports') html = pageReports();
  else if (CURRENT === 'settings') html = pageSettings();
  main.innerHTML = html;

  // wire up page-level buttons
  const opsDateInput = document.getElementById('opsDateInput');
  if (opsDateInput) opsDateInput.addEventListener('change', ()=>{ OPS_DATE = opsDateInput.value; render(); });
  document.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click', ()=>{ OPS_SHIFT = b.dataset.shift; render(); }));
  const shiftSettingsBtn = document.getElementById('shiftSettingsBtn');
  if (shiftSettingsBtn) shiftSettingsBtn.addEventListener('click', formShiftSettings);
  const checkInBtn = document.getElementById('checkInBtn');
  if (checkInBtn) checkInBtn.addEventListener('click', formCheckIn);
  const checkOutBtn = document.getElementById('checkOutBtn');
  if (checkOutBtn) checkOutBtn.addEventListener('click', formCheckOut);
  const addSaleBtn = document.getElementById('addSaleBtn');
  if (addSaleBtn) addSaleBtn.addEventListener('click', formAddSale);
  const managerAddReadingBtn = document.getElementById('managerAddReadingBtn');
  if (managerAddReadingBtn) managerAddReadingBtn.addEventListener('click', formManagerAddReading);
  document.querySelectorAll('[data-verify]').forEach(b=>b.addEventListener('click', ()=>{ if (canVerify()) formVerifyReading(b.dataset.verify); }));
  const addShiftCreditBtn = document.getElementById('addShiftCreditBtn');
  if (addShiftCreditBtn) addShiftCreditBtn.addEventListener('click', formShiftCredit);
  const cashReconBtn = document.getElementById('cashReconBtn');
  if (cashReconBtn) cashReconBtn.addEventListener('click', formCashRecon);

  const addTank = document.getElementById('addTankBtn');
  if (addTank) addTank.addEventListener('click', formAddTank);
  document.querySelectorAll('[data-movement]').forEach(b=>b.addEventListener('click', ()=>formMovement(b.dataset.movement)));

  const addEmp = document.getElementById('addEmpBtn');
  if (addEmp) addEmp.addEventListener('click', formAddEmployee);
  document.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click', ()=>formEmpPayment(b.dataset.pay)));
  document.querySelectorAll('[data-createlogin]').forEach(b=>b.addEventListener('click', ()=>formCreateLoginForEmployee(b.dataset.createlogin)));
  const addStandaloneLoginBtn = document.getElementById('addStandaloneLoginBtn');
  if (addStandaloneLoginBtn) addStandaloneLoginBtn.addEventListener('click', formAddTeam);

  const addLedger = document.getElementById('addLedgerBtn');
  if (addLedger) addLedger.addEventListener('click', formAddLedger);

  const addCust = document.getElementById('addCustBtn');
  if (addCust) addCust.addEventListener('click', formAddCustomer);
  document.querySelectorAll('[data-custtx]').forEach(b=>b.addEventListener('click', ()=>formCustTx(b.dataset.custtx)));
  document.querySelectorAll('[data-viewcust]').forEach(b=>b.addEventListener('click', ()=>{ SELECTED_CUSTOMER_ID = b.dataset.viewcust; CURRENT = 'customer-detail'; render(); }));
  document.querySelectorAll('[data-backcust]').forEach(b=>b.addEventListener('click', ()=>{ CURRENT = 'customers'; render(); }));
  const editCustBtn = document.getElementById('editCustBtn');
  if (editCustBtn) editCustBtn.addEventListener('click', ()=>formEditCustomer(SELECTED_CUSTOMER_ID));
  const recordPaymentBtn = document.getElementById('recordPaymentBtn');
  if (recordPaymentBtn) recordPaymentBtn.addEventListener('click', ()=>formCustTx(SELECTED_CUSTOMER_ID, 'payment'));
  const logCreditBtn = document.getElementById('logCreditBtn');
  if (logCreditBtn) logCreditBtn.addEventListener('click', ()=>formCustTx(SELECTED_CUSTOMER_ID, 'fuel'));
  const genReportBtn = document.getElementById('genReportBtn');
  if (genReportBtn) genReportBtn.addEventListener('click', ()=>{ CURRENT = 'customer-report'; render(); });
  document.querySelectorAll('[data-backcustreport]').forEach(b=>b.addEventListener('click', ()=>{ CURRENT = 'customer-detail'; render(); }));
  const backFromReportBtn = document.getElementById('backFromReportBtn');
  if (backFromReportBtn) backFromReportBtn.addEventListener('click', ()=>{ CURRENT = 'customer-detail'; render(); });
  const printReportBtn = document.getElementById('printReportBtn');
  if (printReportBtn) printReportBtn.addEventListener('click', ()=> window.print());
  const whatsappReportBtn = document.getElementById('whatsappReportBtn');
  if (whatsappReportBtn) whatsappReportBtn.addEventListener('click', ()=>{
    const c = DATA[SKEYS.customers].find(x=>x.id===SELECTED_CUSTOMER_ID);
    if (!c) return;
    const bal = customerBalance(c.id);
    const rows = customerStatementRows(c.id);
    const recent = [...rows].reverse().slice(0, 10);
    let text = `*Swapneswar Filling Station*\nStatement for ${c.name}\nTotal payable: ${fmtMoney(bal)}\n\nRecent transactions:\n`;
    recent.forEach(t=>{
      text += `${fmtDate(t.date)} — ${t.type==='fuel'?'Credit sale':'Payment'} ${t.type==='fuel'?'+':'-'}${fmtMoney(t.amount)} (Bal: ${fmtMoney(t.runningBalance)})\n`;
    });
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  });

  const addNozzle = document.getElementById('addNozzleBtn');
  if (addNozzle) addNozzle.addEventListener('click', formAddNozzle);
  document.querySelectorAll('[data-editnozzle]').forEach(b=>b.addEventListener('click', ()=>formEditNozzle(b.dataset.editnozzle)));

  const reportFromInput = document.getElementById('reportFromInput');
  const reportToInput = document.getElementById('reportToInput');
  if (reportFromInput) reportFromInput.addEventListener('change', ()=>{ REPORT_FROM = reportFromInput.value; render(); });
  if (reportToInput) reportToInput.addEventListener('change', ()=>{ REPORT_TO = reportToInput.value; render(); });
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Service worker registration failed:', err));
  });
}
</script>
