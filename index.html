function relativeAge(iso){
  const ms = Date.now() - new Date(iso).getTime();
  const mins = Math.round(ms/60000);
  if (mins < 60) return mins + ' min ago';
  const hours = Math.round(mins/60);
  if (hours < 24) return hours + ' hour' + (hours===1?'':'s') + ' ago';
  const days = Math.round(hours/24);
  return days + ' day' + (days===1?'':'s') + ' ago';
}

function pageDevOptions(){
  const checkpoints = [...DATA[SKEYS.devBackups]].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  function closestTo(targetMs){
    if (!checkpoints.length) return null;
    return checkpoints.reduce((best, c) => {
      const diff = Math.abs(Date.now() - new Date(c.createdAt).getTime() - targetMs);
      const bestDiff = best ? Math.abs(Date.now() - new Date(best.createdAt).getTime() - targetMs) : Infinity;
      return diff < bestDiff ? c : best;
    }, null);
  }
  const near1h = closestTo(60*60*1000);
  const near1d = closestTo(24*60*60*1000);
  const near1w = closestTo(7*24*60*60*1000);

  return `
    <h1 class="page-title">Developer</h1>
    <div class="page-sub">Hidden maintenance tools — admin only. Not linked from anywhere else in the app.</div>

    <div class="panel">
      <h3>Export / Import</h3>

const BACKUP_COLLECTION_KEYS = COLLECTION_KEYS.filter(k => k !== 'devBackups');

function snapshotAllData(){
  const snapshot = {exportedAt: new Date().toISOString(), collections: {}, opsSettings: DATA[SKEYS.opsSettings]};
  BACKUP_COLLECTION_KEYS.forEach(key => {
    const col = SKEYS[key];
    snapshot.collections[col] = DATA[col] || [];
  });
  return snapshot;
}

function exportAllData(){
  const snapshot = snapshotAllData();
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `swapneswar-backup-${todayISO()}-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function restoreSnapshot(snapshot){
  const ops = [];
  // Wipe every current document in each affected collection, then write the snapshot's documents back with their original ids.
  Object.keys(snapshot.collections).forEach(col => {
    (DATA[col] || []).forEach(doc => ops.push({type:'delete', ref: db.collection(col).doc(doc.id)}));
  });
  Object.entries(snapshot.collections).forEach(([col, docs]) => {
    docs.forEach(doc => {
      const {id, ...data} = doc;
      ops.push({type:'set', ref: db.collection(col).doc(id), data});
    });
  });
  for (let i = 0; i < ops.length; i += 450){
    const batch = db.batch();
    ops.slice(i, i+450).forEach(op => {
      if (op.type === 'delete') batch.delete(op.ref);
      else batch.set(op.ref, op.data);
    });
    await batch.commit();
  }
  if (snapshot.opsSettings) await fsSetSettings(snapshot.opsSettings);
}

function formImportData(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    let snapshot;
    try { snapshot = JSON.parse(e.target.result); }
    catch(err){ alert('That file is not valid JSON.'); return; }
    if (!snapshot.collections){ alert('That file doesn\'t look like a Swapneswar backup.'); return; }
    const proceed = confirm(`Import backup from ${snapshot.exportedAt ? fmtDate(snapshot.exportedAt.slice(0,10)) : 'unknown date'}? This replaces ALL current data with what's in the file. This cannot be undone.`);
    if (!proceed) return;
    try {
      await restoreSnapshot(snapshot);
      alert('Import complete.');
      render();
    } catch(err){
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

async function saveCheckpoint(){
  const snapshot = snapshotAllData();
  await fsAdd(SKEYS.devBackups, {
    createdAt: new Date().toISOString(), createdBy: CURRENT_USER.name,
    dataJson: JSON.stringify(snapshot),
  });
  render();
}

async function restoreCheckpoint(checkpointId){
  const cp = DATA[SKEYS.devBackups].find(c=>c.id===checkpointId);
  if (!cp) return;
  const proceed = confirm(`Restore the checkpoint from ${relativeAge(cp.createdAt)}? This replaces ALL current data. This cannot be undone.`);
  if (!proceed) return;
  try {
    const snapshot = JSON.parse(cp.dataJson);
    await restoreSnapshot(snapshot);
    alert('Restore complete.');
    render();
  } catch(err){
    alert('Restore failed: ' + err.message);
  }
}

function deleteCheckpoint(checkpointId){
  if (!confirm('Delete this checkpoint? This cannot be undone.')) return;
  fsDelete(SKEYS.devBackups, checkpointId).then(render);
}

async function resetTestData(){
  const wipeCollections = [
    SKEYS.shiftReadings, SKEYS.stockTx, SKEYS.saleEntries, SKEYS.custTx,
    SKEYS.cashRecon, SKEYS.cashHandovers, SKEYS.ioclReadings, SKEYS.ledger, SKEYS.customers,
  ];
  const ops = [];
  wipeCollections.forEach(col => {
    (DATA[col] || []).forEach(doc => {
      ops.push({type:'delete', ref: db.collection(col).doc(doc.id)});
    });
  });
  DATA[SKEYS.stock].forEach(t => {
    ops.push({type:'update', ref: db.collection(SKEYS.stock).doc(t.id), data: {currentStock: 0, lastUpdated: todayISO()}});
  });
  // Firestore batches cap at 500 operations — chunk to be safe.
  for (let i = 0; i < ops.length; i += 450){
    const batch = db.batch();
    ops.slice(i, i+450).forEach(op => {
      if (op.type === 'delete') batch.delete(op.ref);
      else batch.update(op.ref, op.data);
    });
    await batch.commit();
  }
}

function exportMovementsCSV(){
  const tx = [...DATA[SKEYS.stockTx]].filter(t=>t.txType==='purchase').sort((a,b)=>new Date(a.date)-new Date(b.date));
  const headers = ['Date','Fuel','Qty (L)','Cost/L','Value','SDMS Indent #','Dispatch/Invoice #','Note'];
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = tx.map(t => [
    fmtDate(t.date), t.fuelType, t.qty,
    t.costPerLitre!=null ? t.costPerLitre : '',
    t.costPerLitre!=null ? Number(t.qty)*Number(t.costPerLitre) : '',
    t.indentNo||'', t.dispatchNo||'', t.note||'',
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `purchase-history-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportAllCustomersCSV(){
  const customers = [...DATA[SKEYS.customers]].sort((a,b)=>a.name.localeCompare(b.name));
  const headers = ['Name','Type','Phone','Address','GSTIN','Credit Limit','Balance Due','Over Limit'];
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = customers.map(c => {
    const bal = customerBalance(c.id);
    const overLimit = c.creditLimit > 0 && bal > c.creditLimit;
    return [
      c.name, c.custType, c.phone||'', c.address||'', c.gstin||'',
      c.creditLimit, bal, overLimit ? 'Yes' : 'No',
    ];
  });
  const totalBalance = customers.reduce((s,c)=>s+customerBalance(c.id),0);
  rows.push(['TOTAL','','','','','',totalBalance,'']);
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `all-customers-report-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ---------------- Account creation (secondary app instance so the
// admin's own session isn't replaced by the new user's session) ----------------
function getSecondaryAuth(){
  let secApp;
  try { secApp = firebase.app('Secondary'); }
  catch(e){ secApp = firebase.initializeApp(firebaseConfig, 'Secondary'); }
  return secApp.auth();
}

async function createLogin({email, password, name, role, employeeId}){
  const secAuth = getSecondaryAuth();
  const cred = await secAuth.createUserWithEmailAndPassword(email, password);
  const newUid = cred.user.uid;
  await secAuth.signOut();
  const username = email.endsWith('@'+LOGIN_DOMAIN) ? email.slice(0, -('@'+LOGIN_DOMAIN).length) : email;
  await db.collection(SKEYS.users).doc(newUid).set({name, role, username});
  if (employeeId){
    await fsUpdate(SKEYS.employees, employeeId, {linkedUid: newUid, loginEmail: email});
  }
  return newUid;
}

function resolvePageAccessForUser(u, pageId){
  const checkId = (pageId === 'customer-detail' || pageId === 'customer-report') ? 'customers' : pageId;
  const roleAllowed = ROLE_PAGE_ACCESS[u.role];
  const baseAllowed = roleAllowed === null || roleAllowed === undefined ? true : roleAllowed.includes(checkId);
  const blocked = u.blockedPages || [];
  const extra = u.extraPages || [];
  if (blocked.includes(checkId)) return false;
  if (extra.includes(checkId)) return true;
  return baseAllowed;
}

function formEditPageAccess(userId){
  const u = DATA[SKEYS.users].find(x=>x.id===userId);
  if (!u) return;
  const roleAllowed = ROLE_PAGE_ACCESS[u.role];
  const roleIsFullAccess = roleAllowed === null || roleAllowed === undefined;
  openModal(`
    <h3>Page access — ${u.name}</h3>
    <p class="subtle" style="margin-bottom:12px;">${u.role==='admin'||u.role==='owner'
      ? `As ${ROLE_LABELS[u.role]||u.role}, their role already grants full access to everything — unchecking a page here restricts them below that default.`
      : `Their ${ROLE_LABELS[u.role]||u.role} role normally grants some pages and not others. Check a box to add access beyond that; uncheck one to remove access they'd normally have.`}</p>
    <form id="f">
      ${ALL_PAGES.map(p=>{
        const checked = resolvePageAccessForUser(u, p.id);
        const isRoleDefault = roleIsFullAccess ? true : (roleAllowed||[]).includes(p.id);
        return `<label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:normal;">
          <input type="checkbox" name="page_${p.id}" ${checked?'checked':''} style="width:auto;">
          ${p.label}${!isRoleDefault ? ` <span class="subtle">(not in their role by default)</span>` : ''}
        </label>`;
      }).join('')}
      <div class="modal-actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn">Save access</button>
      </div>
    </form>
  `);
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const extraPages = [];
    const blockedPages = [];
    ALL_PAGES.forEach(p => {
      const checked = fd.get('page_'+p.id) === 'on';
      const isRoleDefault = roleIsFullAccess ? true : (roleAllowed||[]).includes(p.id);
      if (checked && !isRoleDefault) extraPages.push(p.id);
      if (!checked && isRoleDefault) blockedPages.push(p.id);
    });
    await fsUpdate(SKEYS.users, userId, {extraPages, blockedPages});
    closeModal(); render();
  });
}
